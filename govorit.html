1 ч.1", "Дача взятки", "★★★★ · 3× взятка (80–250 тыс. ₽) / до 40 мес.", "Р/Ф"]], "notes": {"166": "Угон, только если машину сдвинули с места. Сел в чужую машину и завёл, но не тронулся — не угон. Угнанную машину задержите («О полиции» 3.4 «д»). Угон — основание для лишения прав (закон о госдокументах 3.8.5).", "222": "Обыскать машину можно, если есть признаки преступления у водителя, пассажира или в связи с машиной (УПК 182 ч.11). Изымайте только запрещённое и важное для дела (УПК 182 ч.8.1). Оружие в машине — основание для лишения прав (закон о госдокументах 3.8.4). Лицензию на оружие изымают при задержании по 222 ч.1 (3.12.2). Государственного образца — ч.2.", "228": "Порога «до 3 г» больше нет: любое количество до 5 г — ч.1. Считайте: 1 пакетик, куст или семя = 1 г. Выращивание — УК 231. Наркотики сверх нормы в машине — основание для лишения прав (3.8.4).", "231": "Посадка, полив, уход — в любом количестве. 6 растений и больше или группой — ч.2 (до 30 мес.).", "264": "Сначала оформление ДТП: первая помощь, скорая, ограждение, фиксация, схема («О полиции» 3.3, 5.2).", "291": "Передал деньги — дача взятки. Только предложил, вы отказались — покушение: задерживайте по 291 со ссылкой на ст. 30 и скажите об этом принимающему. Всё на видео.", "314": "Звезда розыска при задержании не растёт. Розыск за конкретное преступление — отвечает по той статье. Нельзя задерживать в больнице и после снятия розыска без ордера.", "317": "Действия с целью помешать службе или из мести, направленные на причинение смерти. Применение оружия допустимо (закон об оружии 3.5 ч.1 «а», «г»). Одиночный удар без вреда здоровью и без намерения убить — не 317.", "318": "ч.1 — насилие, не опасное для жизни, или угроза. Опасное для жизни или здоровья — ч.2. Угроза убийством — УК 119.", "319": "ч.1 — публично (при посторонних). Непублично — КоАП 5.7 (до 10 000 ₽). Сотрудника СК, Генпрокуратуры, «Вести Москвы» или медика — ч.3, даже непублично. Если оскорбил в ходе процессуальных действий, к сроку можно прибавить (УК 69 ч.4) — скажите об этом принимающему.", "319.1": "ч.1 — только требование ГИБДД об остановке машины. Остальные законные требования полиции — ч.2. Отказ снять маску или показать документы сам по себе не преступление и не основание задержать (примечание к 319.1, УПК 91 ч.4). Задержать можно только в ходе пресечения или непрерывного преследования, в том числе пока он в розыске; после снятия розыска — только по ордеру или решению суда (УПК 91 ч.3.1).", "315.1": "Отказом считается: вернул протокол, порвал его, отказался устно или письменно, игнорирует. Перед этим убедитесь, что предложили отвезти к банкомату, если нет наличных. По УК 315.1 ч.1 преступление — и отказ от уплаты штрафа на месте, и неуплата постановления за 24 часа.", "319.2": "Мешает задерживать или арестовывать другого человека. Если мешает госслужащий — ч.2.", "319.3": "Только после устного требования прекратить на видео, разъяснения последствий и времени, чтобы прекратить.", "222.3": "Глушилка в машине — основание для лишения прав (закон о госдокументах 3.8.4). Лицензию на оружие при задержании по 222.3 тоже изымают (3.12.2).", "213.1": "Неприкосновенному: требование уйти и 10 секунд, затем вывести и отпустить. Задержание — только если вернулся в течение 24 часов и снова не ушёл (ч.4). На прокуроров не распространяется (ФЗ о неприкосновенности 2.6.2). Охраняемая территория — не преступление."}, "jur": {"Р": "дознавателю МВД (не ГИБДД) или в СК", "Ф": "ФСБ (Управление «М») или в СК", "Р/Ф": "дознавателю МВД (не ГИБДД), ФСБ или СК по подследственности; не уверены — в СК", "Р/Ф/В": "дознавателю МВД (не ГИБДД), ФСБ или СК; если преступление военного — военной полиции; не уверены — в СК"}}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById("data").textContent);
var out=document.getElementById("out"),q=document.getElementById("q"),sel=null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().replace(/ё/g,"е")}
function stem(x){x=norm(x);return x.length>5?x.slice(0,x.length-2):x.length>=4?x.slice(0,x.length-1):x}
function say(t){return esc(t).replace(/\[([^\]]+)\]/g,"<em>[$1]</em>")}
function ref(a){var m=a.match(/^(\S+)(?: ч\.(\d+))?$/);return m[2]?"части "+m[2]+" статьи "+m[1]:"статьи "+m[1]}
function lc(s){return s.charAt(0).toLowerCase()+s.slice(1)}
function block(id,title,text,note,extra){return '<section class="step'+(extra&&extra.key?" key":"")+'"><h2><span class="num">'+esc(extra&&extra.n||"•")+'</span><span>'+esc(title)+(extra&&extra.practice?'<span class="tag">практика</span>':"")+'</span></h2><div class="say"><b>Скажите</b><q id="t-'+id+'">'+say(text)+'</q></div><button class="copy" type="button" data-c="'+id+'" data-text="'+esc(text)+'">Скопировать</button>'+(note?'<p class="note">'+esc(note)+'</p>':"")+"</section>"}
function articleBlocks(a){
 var r=D.rows.filter(function(x){return x[0]===a})[0]; if(!r) return "";
 var base=a.replace(/\s.*$/,"").replace(/ч\..*$/,"").trim(), nt=D.notes[base]||"";
 var desc=lc(r[1]);
 var t1="Вы задержаны по подозрению в совершении преступления, предусмотренного "+ref(a)+" Уголовного кодекса РО, а именно: "+desc+". Вы имеете право на защиту и вправе вызвать адвоката. По вашей просьбе указанные статьи будут разъяснены полностью.";
 var t2="Здравствуйте, инспектор ДПС ГИБДД [звание, фамилия]. Передаю задержанного [имя, фамилия, номер паспорта]. Задержан [дата, время] по "+ref(a)+" УК РО, а именно: "+desc+". Основание: [что было]. Причина, статья и право на защиту разъяснены. Обыск [проведён / не проводился], изъято: [перечень или «ничего»]. Личность [установлена / нет]. Госслужащим [является / нет]. Видеозапись есть. Прошу принять задержанного, материалы и изъятое.";
 var j=r[3]||"";
 var h='<div class="h">По статье: УК '+esc(a)+'</div><div class="sanc">'+esc(r[1])+" · "+esc(r[2])+(j?" · ["+esc(j)+"]":"")+"</div>";
 h+=block("a1","Объявить причину и права",t1,"Читайте чётко. Попросил разъяснить статью — зачитайте её полностью (УПК 92 ч.1 «г»).",{key:true});
 h+=block("a2","Передать принимающему",t2,"Кому: "+(D.jur[j]||D.jur["Р/Ф"])+" (УПК 151).",{key:true});
 if(nt) h+='<div class="warnbox"><b>Особенности статьи.</b> '+esc(nt)+"</div>";
 return h}
function render(){
 var v=q.value.trim(),w=v.split(/\s+/).filter(function(x){return x.length>1}).map(stem),h="";
 var steps=D.steps.filter(function(s){if(!w.length)return true;var t=norm(s.t+" "+s.kw+" "+s.say+" "+s.note);return w.every(function(x){return t.indexOf(x)>-1})});
 var rows=D.rows.filter(function(r){if(!w.length)return true;var t=norm(r[0]+" "+r[1]);return w.every(function(x){return t.indexOf(x)>-1})});
 if(w.length&&!sel&&rows.length&&rows.length<=6&&/\d/.test(v)) {}
 if(sel&&!w.length) h+=articleBlocks(sel);
 else if(w.length&&rows.length&&rows.length<D.rows.length){h+='<div class="h">Статьи — нажмите, чтобы получить фразу</div><div class="chips">'+rows.map(function(r){return '<button type="button" data-a="'+esc(r[0])+'" title="'+esc(r[1])+'">'+esc(r[0])+"</button>"}).join("")+"</div>"}
 if(!w.length){h+='<div class="h">По статье</div><p class="note">Выберите статью — получите готовые фразы: объявить причину и права, передать МВД.</p><div class="chips">'+D.rows.map(function(r){return '<button type="button" aria-pressed="'+(r[0]===sel)+'" data-a="'+esc(r[0])+'" title="'+esc(r[1])+'">'+esc(r[0])+"</button>"}).join("")+"</div>"+(sel?"":"")+(sel?articleBlocks(sel):"")}
 if(!w.length)h+='<div class="h">Порядок задержания и фразы</div>'; else if(steps.length) h+='<div class="h">Фразы</div>';
 h+=steps.map(function(s){return block(s.id,s.t,s.say,s.note,{n:s.n,key:s.key,practice:s.practice})}).join("");
 if(w.length&&!steps.length&&!rows.length)h+='<p class="empty">Ничего не нашлось. Попробуйте: права, обыск, маска, адвокат, передать или номер статьи.</p>';
 out.innerHTML=h}
document.addEventListener("click",function(e){
 var a=e.target.closest("[data-a]");if(a){sel=sel===a.dataset.a&&!q.value.trim()?null:a.dataset.a;q.value="";render();if(sel){var el=out.querySelector(".h");el&&el.scrollIntoView({block:"start"})}return}
 var c=e.target.closest(".copy");if(c){var t=c.dataset.text,done=function(){c.classList.add("ok");c.textContent="Скопировано";setTimeout(function(){c.classList.remove("ok");c.textContent="Скопировать"},1500)};
  var sl=function(){var r=document.createRange(),n=document.getElementById("t-"+c.dataset.c);r.selectNodeContents(n);var s=getSelection();s.removeAllRanges();s.addRange(r);c.textContent="Выделено, Ctrl+C"};
  try{navigator.clipboard.writeText(t).then(done,sl)}catch(x){sl()}}});
q.addEventListener("input",function(){sel=null;render()});
addEventListener("keydown",function(e){var t=e.target&&e.target.tagName;if((e.key==="/"||(e.metaKey||e.ctrlKey)&&e.code==="KeyK")&&t!=="INPUT"){e.preventDefault();q.focus();q.select()}});
var hs=location.hash.slice(1);if(hs&&decodeURIComponent(hs)){var dh=decodeURIComponent(hs);if(D.rows.some(function(r){return r[0]===dh}))sel=dh}
render()})();
</script></body></html>
