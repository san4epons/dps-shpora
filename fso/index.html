<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Экзамен ФСО РО</title>
<meta name="description" content="Экзамен ФСО РО: формат, состав экзаменаторов, кабинет экзаменатора и билет кандидата">
<meta name="theme-color" content="#0e141c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e141c;--surface:#16202d;--surface-2:#1c2838;--ink:#e4e9f1;--muted:#95a3b6;--line:#263446;--accent:#4d8dff;--accent-ink:#fff;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--r:2px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1f5;--surface:#fff;--surface-2:#f4f6f9;--ink:#142030;--muted:#5a6779;--line:#d6dce5;--accent:#1d4fa3;--ok:#1a7f37;--bad:#cf222e;--warn:#9a6700}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 80px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.brand b{color:var(--ink)}
h1{font-size:clamp(28px,6vw,44px);line-height:1.05;margin:18px 0 6px;text-transform:uppercase}
h2{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px;font-weight:600}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--surface);margin:12px 0 14px}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}.kpi:first-child{border-left:0}
.kpi b{display:block;font-family:var(--mono);font-size:28px;line-height:1}.kpi span{display:block;margin-top:6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:inherit;font-size:14.5px;font-weight:700;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{border-color:var(--muted)}.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn[disabled]{opacity:.5;cursor:wait}
.rows{border:1px solid var(--line);background:var(--surface)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row small{display:block;color:var(--muted);font-size:13px}.mono{font-family:var(--mono)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--line);margin:8px 0}
.step{padding:12px 12px 0 0}.step b{font-family:var(--mono);color:var(--accent);font-size:12px;display:block}.step span{font-size:14px}
.box{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--accent);padding:14px 16px;margin:10px 0}
.box p{margin:4px 0}
form label{display:grid;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=password],input[type=search],textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.note{color:var(--muted);font-size:13.5px}.err{color:var(--bad);font-weight:600}
.me{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;margin:14px 0}
.me .l{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}
.seg{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 14px;scrollbar-width:none}
.seg button{flex:0 0 auto;font:inherit;font-size:14.5px;font-weight:700;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 16px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.it{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:8px}.it:first-child{border-top:0}
.it .hd{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.it .q{font-weight:700;margin:0;line-height:1.4}
.it details summary{cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:600}
.it .a{margin:6px 0 0;line-height:1.5;font-size:14.5px}.it .a small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px}
.it ol{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.it.s1{box-shadow:inset 2px 0 0 var(--ok)}.it.s05{box-shadow:inset 2px 0 0 var(--warn)}.it.s0{box-shadow:inset 2px 0 0 var(--bad)}
.gr{display:inline-flex;border:1px solid var(--line)}.gr button{font:inherit;font-size:13px;font-weight:600;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 12px;cursor:pointer}.gr button:last-child{border-right:0}
.gr button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.timer{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin:0 0 10px}
.timer b{font-family:var(--mono);font-size:26px}.timer.over b{color:var(--bad)}
.res{font-family:var(--mono);font-size:44px;font-weight:700;margin:4px 0}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
pre{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);padding:10px 12px}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}.kpi b{font-size:24px}.steps{grid-template-columns:1fr 1fr}.acts .btn{flex:1 1 40%}.gr{display:flex}.gr button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span class="brand"><b>ФСО РО</b> · экзамен</span><a class="brand" href="trener/" style="text-decoration:none">Тренажёр →</a></div>
<div id="app"></div>
<p class="foot">Экзамен проводит отдел первичной подготовки УПП ФСО (ФЗ «О ФСО» гл. 3 ст. 6). Вопросы — только из тренажёра. Ключ экзаменатора не передавать: каждый вход и действие пишутся в журнал.</p>
</div>
<script type="application/json" id="data">{"cards":[{"id":"S01","tp":"Статус и подчинение","lv":1,"q":"Что такое ФСО РО?","a":"Федеральный правоохранительный орган исполнительной власти: государственная охрана, защита государственной тайны, правительственная и специальная связь.","r":"ФЗ гл. 1 ст. 1 ч. 1"},{"id":"S02","tp":"Статус и подчинение","lv":1,"q":"Кому подчиняется ФСО?","a":"Премьер-министру РО, Председателю Правительства РО, Директору ФСО и его заместителям.","r":"ФЗ гл. 1 ст. 1 ч. 2"},{"id":"S03","tp":"Статус и подчинение","lv":1,"q":"Какова основная цель деятельности ФСО?","a":"Гарантированное выполнение задач государственной охраны и защиты объектов госохраны, работа систем защиты информации и связи в интересах высших органов власти РО.","r":"ФЗ гл. 1 ст. 1 ч. 3"},{"id":"S04","tp":"Статус и подчинение","lv":1,"q":"Что составляет правовую основу деятельности ФСО?","a":"Конституция РО, ФЗ «О ФСО», другие нормативные правовые акты РО.","r":"ФЗ гл. 1 ст. 1 ч. 4"},{"id":"S05","tp":"Статус и подчинение","lv":1,"q":"Кто осуществляет надзор за исполнением законов сотрудниками ФСО?","a":"Центральный аппарат Министерства юстиции.","r":"ФЗ гл. 1 ст. 1 ч. 7"},{"id":"S06","tp":"Статус и подчинение","lv":2,"q":"Как работает ФСО при чрезвычайном положении?","a":"В штатном режиме, в рамках своих полномочий.","r":"ФЗ гл. 2 ст. 2 ч. 6"},{"id":"S07","tp":"Статус и подчинение","lv":2,"q":"Можно ли сотруднику ФСО участвовать в перестрелках во время военного положения?","a":"Нет. При военном положении огнестрельное оружие применяется только для защиты охраняемых лиц; участие в иных перестрелках не допускается.","r":"ФЗ гл. 2 ст. 2 ч. 7"},{"id":"S08","tp":"Статус и подчинение","lv":1,"q":"Что действует, если Устав ФСО противоречит закону?","a":"Нормы законодательства РО.","r":"Устав ст. 1 ч. 3"},{"id":"S09","tp":"Статус и подчинение","lv":1,"q":"Каков статус сотрудника ФСО при исполнении?","a":"Представитель власти, находится под защитой государства; его законные требования обязательны для граждан и должностных лиц.","r":"ФЗ гл. 2 ст. 2 чч. 1–2"},{"id":"O01","tp":"Объекты охраны и задачи","lv":1,"q":"Кто и что относится к объектам государственной охраны?","a":"Правительственные здания; Премьер-министр, Председатель Правительства, члены Кабинета Министров, судьи, мэры и иные лица по решению Правительства РО; в отдельных случаях — места мероприятий первых лиц и Правительства.","r":"ФЗ гл. 4 ст. 1 ч. 2"},{"id":"O02","tp":"Объекты охраны и задачи","lv":1,"q":"Может ли охраняемое должностное лицо отказаться от государственной охраны?","a":"Нет — на протяжении всего срока пребывания в должности.","r":"ФЗ гл. 4 ст. 1 ч. 2.1"},{"id":"O03","tp":"Объекты охраны и задачи","lv":2,"q":"Кто решает, кого ещё взять под охрану, кроме перечисленных в законе лиц?","a":"Правительство РО (по действующему ФЗ). В Уставе от 27.08 осталось старое «по поручению Директора ФСО» — действует закон.","r":"ФЗ гл. 4 ст. 1 ч. 2; Устав ст. 9"},{"id":"O04","tp":"Объекты охраны и задачи","lv":1,"q":"Назовите не менее четырёх основных задач защитной миссии ФСО.","a":"Прогноз и выявление угроз; безопасность объектов охраны; участие в борьбе с терроризмом при угрозе первым лицам; пресечение правонарушений в районах охраны; защита персональных данных охраняемых и их семей; защита госстроя и безопасности внутри Правительства; секретные правительственные поручения.","r":"ФЗ гл. 4 ст. 2"},{"id":"O05","tp":"Объекты охраны и задачи","lv":2,"q":"Обязан ли сотрудник ФСО пресекать преступление, не связанное с охраняемым лицом?","a":"Да, ФСО обязана пресекать любые преступления против личности, общества и государства — кроме случаев, когда это создаёт риск для жизни охраняемого объекта.","r":"ФЗ гл. 4 ст. 2 ч. 6"},{"id":"O06","tp":"Объекты охраны и задачи","lv":2,"q":"Что ФСО делает с выявленной утечкой засекреченной информации из Правительства?","a":"Пресекает и передаёт материалы в ФСБ или СК в соответствии с подследственностью.","r":"ФЗ гл. 4 ст. 1 ч. 3.3; ст. 3 ч. 5"},{"id":"O07","tp":"Объекты охраны и задачи","lv":2,"q":"Может ли ФСО расследовать дело против члена Кабинета Министров?","a":"Нет. Расследовать в отношении Премьер-министра, Вице-премьер-министра, членов Кабинета и других должностных лиц нельзя; доказательства о преступлениях — в СК, об иных правонарушениях — в прокуратуру.","r":"ФЗ гл. 4 ст. 1 ч. 3.4"},{"id":"O08","tp":"Объекты охраны и задачи","lv":1,"q":"Что входит в обеспечение охраняемого лица помимо физической защиты?","a":"Информация об угрозе, транспортное и бытовое обслуживание, безопасное питание, санитарно-эпидемиологическое благополучие.","r":"ФЗ гл. 4 ст. 1 ч. 3"},{"id":"O09","tp":"Объекты охраны и задачи","lv":2,"q":"Когда ФСО выполняет секретные правительственные поручения?","a":"Когда их нельзя доверить другим ведомствам, особенно если ведомство или его сотрудники утратили доверие Правительства.","r":"ФЗ гл. 4 ст. 2 ч. 9"},{"id":"C01","tp":"Структура, руководство, звания","lv":1,"q":"Из каких управлений состоит ФСО?","a":"УСН — Управление специального назначения; УПП — Учебно-подготовительное управление; УСБ — Управление собственной безопасности.","r":"Устав ст. 5; ФЗ гл. 3"},{"id":"C02","tp":"Структура, руководство, звания","lv":1,"q":"Какие отделы входят в УСН?","a":"Комендатура Кремля; отдел обеспечения специального сопровождения (ОС); Служба безопасности Премьер-министра (СБП).","r":"Устав ст. 5 ч. 2"},{"id":"C03","tp":"Структура, руководство, звания","lv":1,"q":"Какой отдел входит в УПП?","a":"Отдел первичной подготовки (ОПП).","r":"Устав ст. 5 ч. 3"},{"id":"C04","tp":"Структура, руководство, звания","lv":1,"q":"Какие отделы входят в УСБ?","a":"Отдел внутренних расследований (ВР) и отдел оперативного контроля (ОК).","r":"Устав ст. 5 ч. 4"},{"id":"C05","tp":"Структура, руководство, звания","lv":1,"q":"Кто составляет высшее руководство ФСО?","a":"Директор ФСО, Первый заместитель Директора, заместители Директора по направлениям (не более двух).","r":"ФЗ гл. 2 ст. 4 ч. 1"},{"id":"C06","tp":"Структура, руководство, звания","lv":2,"q":"Сколько всего может быть заместителей Директора ФСО?","a":"Не больше трёх, включая Первого заместителя.","r":"ФЗ гл. 2 ст. 4 ч. 5"},{"id":"C07","tp":"Структура, руководство, звания","lv":2,"q":"Кто курирует УСН, УПП и УСБ?","a":"УСН — Первый заместитель Директора; УПП и УСБ — по одному заместителю Директора.","r":"ФЗ гл. 2 ст. 4 ч. 4"},{"id":"C08","tp":"Структура, руководство, звания","lv":1,"q":"Что делает Первый заместитель Директора ФСО?","a":"Замещает Директора, координирует УСН, УПП и УСБ, контролирует исполнение приказов, организует взаимодействие подразделений; курирует УСН.","r":"ФЗ гл. 2 ст. 4 ч. 3"},{"id":"C09","tp":"Структура, руководство, звания","lv":1,"q":"Перечислите звания ФСО снизу вверх.","a":"Лейтенант → капитан → майор → подполковник → полковник → генерал-лейтенант → генерал-полковник.","r":"ФЗ гл. 2 ст. 3; Устав ст. 8"},{"id":"C10","tp":"Структура, руководство, звания","lv":1,"q":"С какого звания начинается служба в ФСО?","a":"С лейтенанта.","r":"ФЗ гл. 2 ст. 3 ч. 2"},{"id":"C11","tp":"Структура, руководство, звания","lv":2,"q":"На каких условиях присваивается очередное звание?","a":"За выслугу, заслуги или в порядке поощрения, при отчёте о работе по системе повышений ФСО и не чаще одного звания в сутки; при переводе из другой госорганизации эти требования не применяются.","r":"ФЗ гл. 2 ст. 3 ч. 3"},{"id":"C12","tp":"Структура, руководство, звания","lv":1,"q":"В каком звании начальник УСН и начальник УСБ?","a":"Полковник.","r":"ФЗ гл. 3 ст. 1, ст. 7"},{"id":"C13","tp":"Структура, руководство, звания","lv":2,"q":"Сотрудник Комендатуры временно работает за СБП. В каком отделе он числится?","a":"В СБП — на весь период исполнения её обязанностей.","r":"ФЗ гл. 3 ст. 11 ч. 6"},{"id":"C14","tp":"Структура, руководство, звания","lv":2,"q":"Когда УПП может исполнять обязанности УСН?","a":"При временном отсутствии или кадровой недостаточности отдела либо по прямому распоряжению начальника ФСО или его первого заместителя.","r":"ФЗ гл. 3 ст. 11 ч. 5"},{"id":"C15","tp":"Структура, руководство, звания","lv":2,"q":"Кто может распорядиться, чтобы ОС закрыл обязанности Комендатуры?","a":"Начальник УСН (а также при отсутствии или нехватке людей в Комендатуре).","r":"ФЗ гл. 3 ст. 11 ч. 2"},{"id":"K01","tp":"УСН: Комендатура Кремля","lv":1,"q":"Чем занимается Комендатура Кремля?","a":"Пропускной режим и физическая охрана объектов Московского Кремля и прилегающих территорий.","r":"ФЗ гл. 3 ст. 2"},{"id":"K02","tp":"УСН: Комендатура Кремля","lv":1,"q":"Кто руководит Комендатурой Кремля?","a":"Комендант и его заместители.","r":"ФЗ гл. 3 ст. 2"},{"id":"K03","tp":"УСН: Комендатура Кремля","lv":1,"q":"Что входит в пропускной режим?","a":"Допуск лиц, транспорта и материальных ценностей на охраняемые объекты; проверка документов и оснований нахождения на объекте.","r":"ФЗ гл. 3 ст. 2 ч. 1 «а»"},{"id":"K04","tp":"УСН: Комендатура Кремля","lv":2,"q":"Назовите функции Комендатуры, кроме пропускного режима.","a":"Патрулирование и наблюдение; превентивные меры; силовое реагирование и задержание с передачей уполномоченным; отражение нападений; взаимодействие с УСБ.","r":"ФЗ гл. 3 ст. 2 ч. 1"},{"id":"K05","tp":"УСН: Комендатура Кремля","lv":1,"q":"Какие права у Комендатуры?","a":"Требовать соблюдения пропускного и внутриобъектового режима; досмотр ручной клади, транспорта и личный досмотр посетителей по закону; сила, спецсредства и оружие по закону.","r":"ФЗ гл. 3 ст. 2 ч. 2"},{"id":"K06","tp":"УСН: Комендатура Кремля","lv":2,"q":"Комендатура задержала нарушителя на объекте. Что дальше?","a":"Передать уполномоченным должностным лицам в порядке, установленном законом (по УПК — органу по подследственности).","r":"ФЗ гл. 3 ст. 2 ч. 1 «г»"},{"id":"K07","tp":"УСН: Комендатура Кремля","lv":2,"q":"С кем Комендатура взаимодействует по выявлению нарушений?","a":"С УСБ, а также с иными подразделениями ФСО в рамках компетенции.","r":"ФЗ гл. 3 ст. 2 ч. 1 «ё»"},{"id":"V01","tp":"УСН: спецсопровождение (ОС)","lv":1,"q":"Чем занимается отдел спецсопровождения (ОС)?","a":"Безопасность передвижения охраняемых лиц.","r":"ФЗ гл. 3 ст. 3"},{"id":"V02","tp":"УСН: спецсопровождение (ОС)","lv":1,"q":"Сколько машин в кортеже сопровождения?","a":"Не менее двух и не более десяти.","r":"ФЗ гл. 3 ст. 3 ч. 1 «а»"},{"id":"V03","tp":"УСН: спецсопровождение (ОС)","lv":1,"q":"Назовите функции ОС.","a":"Вооружённое сопровождение; силовое обеспечение маршрута (оценка, посты, перекрытие); реагирование на нападения; эвакуация и защита охраняемого.","r":"ФЗ гл. 3 ст. 3 ч. 1"},{"id":"V04","tp":"УСН: спецсопровождение (ОС)","lv":2,"q":"Чей транспорт ОС может использовать для погони за напавшим?","a":"Служебный транспорт государственных органов — в экстренных случаях. Транспорт граждан и организаций — нельзя (так было до 27.10).","r":"ФЗ гл. 3 ст. 3 ч. 2 «б»"},{"id":"V05","tp":"УСН: спецсопровождение (ОС)","lv":1,"q":"Может ли ОС перекрыть движение?","a":"Да, временно ограничить движение транспорта и пешеходов на пути кортежа.","r":"ФЗ гл. 3 ст. 3 ч. 2 «в»"},{"id":"V06","tp":"УСН: спецсопровождение (ОС)","lv":1,"q":"Можно ли не ответить на запрос о сопровождении?","a":"Нет, игнорировать запрос недопустимо. Рабочие выезды руководства Правительства — только с ФСО.","r":"ФЗ гл. 4 ст. 3 ч. 2"},{"id":"V07","tp":"УСН: спецсопровождение (ОС)","lv":2,"q":"Что делает ОС при нападении на кортеж?","a":"Незамедлительно пресекает посягательство, отражает нападение, нейтрализует нападающих и эвакуирует охраняемого, защищая его до прибытия резерва.","r":"ФЗ гл. 3 ст. 3 ч. 1 «в», «г»"},{"id":"B01","tp":"УСН: СБ Премьер-министра","lv":1,"q":"Чем занимается Служба безопасности Премьер-министра?","a":"Непосредственная физическая охрана Премьер-министра РО — в местах пребывания, при передвижении, на публичных мероприятиях.","r":"ФЗ гл. 3 ст. 4"},{"id":"B02","tp":"УСН: СБ Премьер-министра","lv":1,"q":"Назовите функции СБП.","a":"Личная безопасность Премьер-министра; организация охраны; силовые операции по нейтрализации угроз; превентивные меры; взаимодействие с УСН и УСБ.","r":"ФЗ гл. 3 ст. 4 ч. 1"},{"id":"B03","tp":"УСН: СБ Премьер-министра","lv":2,"q":"Что СБП проверяет превентивно?","a":"Выявляет потенциально опасных лиц, проверяет помещения, транспорт и предметы перед использованием.","r":"ФЗ гл. 3 ст. 4 ч. 1 «г»"},{"id":"B04","tp":"УСН: СБ Премьер-министра","lv":1,"q":"Какие права у СБП?","a":"Сила, спецсредства, оружие по закону; усиленные меры при угрозе; проверка документов на охранных мероприятиях; личный досмотр граждан и вещей на мероприятиях с Премьером; досмотр транспорта по ст. 182 УПК.","r":"ФЗ гл. 3 ст. 4 ч. 2"},{"id":"B05","tp":"УСН: СБ Премьер-министра","lv":2,"q":"По какой статье УПК СБП досматривает транспорт?","a":"Статья 182 УПК РО — в случаях и порядке, ею предусмотренных.","r":"ФЗ гл. 3 ст. 4 ч. 2 «г»"},{"id":"B06","tp":"УСН: СБ Премьер-министра","lv":2,"q":"Когда СБП вправе ввести усиленные меры безопасности?","a":"При получении информации о возможной угрозе.","r":"ФЗ гл. 3 ст. 4 ч. 2 «б»"},{"id":"P01","tp":"УПП: ОПП и стажировка","lv":1,"q":"Чем занимается Учебно-подготовительное управление?","a":"Приём, первичная подготовка и допуск новых сотрудников.","r":"ФЗ гл. 3 ст. 5"},{"id":"P02","tp":"УПП: ОПП и стажировка","lv":1,"q":"Назовите функции отдела первичной подготовки.","a":"Приём новичков и адаптация; ознакомление с уставом, структурой и регламентами; базовая физическая, огневая и тактическая подготовка; проверка знаний и приём теоретических экзаменов.","r":"ФЗ гл. 3 ст. 6 ч. 1"},{"id":"P03","tp":"УПП: ОПП и стажировка","lv":1,"q":"Какие права у ОПП?","a":"Собеседования в любом здании Правительства; требовать документы от новоприбывших; лекции и публикация материалов; итоговая аттестация и направление на службу в доступное подразделение.","r":"ФЗ гл. 3 ст. 6 ч. 2"},{"id":"P04","tp":"УПП: ОПП и стажировка","lv":1,"q":"Назовите требования к кандидату на стажировку.","a":"Гражданин РО; владеет государственным языком; от 21 года; актуальные мед. справки; проверка на благонадёжность (при необходимости полиграф); действующая лицензия на оружие; нет судимостей, не в розыске.","r":"ФЗ гл. 2 ст. 1; Устав ст. 7 ч. 1"},{"id":"P05","tp":"УПП: ОПП и стажировка","lv":1,"q":"Какую подготовку проходят стажёры?","a":"Обязательную образовательную, боевую и тактическую.","r":"ФЗ гл. 2 ст. 1"},{"id":"P06","tp":"УПП: ОПП и стажировка","lv":2,"q":"Кандидату 20 лет, у него есть лицензия на оружие и справки. Возьмут на стажировку?","a":"Нет — требуется возраст от 21 года.","r":"ФЗ гл. 2 ст. 1"},{"id":"P07","tp":"УПП: ОПП и стажировка","lv":1,"q":"Опишите путь стажёра до службы.","a":"Собеседование → документы → стажировка (образовательная, боевая, тактическая) → экзамены → итоговая аттестация в ОПП → направление в доступное подразделение в звании лейтенанта.","r":"Устав ст. 7; ФЗ гл. 3 ст. 6"},{"id":"P08","tp":"УПП: ОПП и стажировка","lv":2,"q":"Где ОПП вправе проводить собеседование?","a":"В любом здании Правительства РО.","r":"ФЗ гл. 3 ст. 6 ч. 2 «а»"},{"id":"U01","tp":"УСБ: ВР и ОК","lv":1,"q":"Чем занимается Управление собственной безопасности?","a":"Контроль дисциплины, законности и внутренней безопасности ФСО.","r":"ФЗ гл. 3 ст. 7"},{"id":"U02","tp":"УСБ: ВР и ОК","lv":1,"q":"Чем занимается отдел внутренних расследований?","a":"Служебные проверки сотрудников ФСО, разбор материалов о нарушениях, сбор доказательств и опрос свидетелей, заключения и предложения о дисциплинарных мерах.","r":"ФЗ гл. 3 ст. 8 ч. 1"},{"id":"U03","tp":"УСБ: ВР и ОК","lv":1,"q":"Какие права у отдела ВР?","a":"Запрашивать у сотрудников объяснения и документы; вносить представления о временном отстранении; передавать материалы уполномоченным лицам.","r":"ФЗ гл. 3 ст. 8 ч. 2"},{"id":"U04","tp":"УСБ: ВР и ОК","lv":1,"q":"Чем занимается отдел оперативного контроля?","a":"Наблюдение за несением службы, внезапные проверки, оценка добросовестности, антикоррупционные мероприятия внутри ФСО.","r":"ФЗ гл. 3 ст. 9 ч. 1"},{"id":"U05","tp":"УСБ: ВР и ОК","lv":1,"q":"Какие права у отдела ОК?","a":"Внезапные проверки любых подразделений ФСО; требовать отчёты о службе; при признаках нарушения — уведомить начальника УСБ и передать материалы в ВР.","r":"ФЗ гл. 3 ст. 9 ч. 2"},{"id":"U06","tp":"УСБ: ВР и ОК","lv":2,"q":"ОК обнаружил признаки нарушения у сотрудника. Порядок?","a":"Незамедлительно уведомить начальника УСБ и передать материалы в отдел ВР.","r":"ФЗ гл. 3 ст. 9 ч. 2 «в»"},{"id":"U07","tp":"УСБ: ВР и ОК","lv":2,"q":"Может ли ВР сам отстранить сотрудника от службы?","a":"Нет, ВР вносит представление о временном отстранении при достаточных основаниях; решение принимает уполномоченное лицо.","r":"ФЗ гл. 3 ст. 8 ч. 2 «б»"},{"id":"D01","tp":"Обязанности и права","lv":1,"q":"Что сотрудник ФСО вправе проверять на охраняемом объекте?","a":"Документы, удостоверяющие личность, документы на транспорт и грузы; личный досмотр при входе и выходе, досмотр вещей и грузов, осмотр транспорта; досмотр транспорта — по ст. 182 УПК, в том числе техническими средствами.","r":"ФЗ гл. 4 ст. 3 ч. 12"},{"id":"D02","tp":"Обязанности и права","lv":2,"q":"Гражданин снимает на телефон охрану у здания Правительства. Что можно сделать?","a":"Потребовать прекратить съёмку, если он не защищает этим свои права. Изымать, удалять или ограничивать доступ к снятому нельзя.","r":"ФЗ гл. 4 ст. 3 ч. 13"},{"id":"D03","tp":"Обязанности и права","lv":1,"q":"Что ФСО делает с подозрительным предметом у объекта?","a":"Диагностика, эвакуация и уничтожение предметов, похожих на взрывчатку, диверсионные средства или устройства несанкционированного доступа к информации.","r":"ФЗ гл. 4 ст. 3 ч. 4"},{"id":"D04","tp":"Обязанности и права","lv":1,"q":"Можно ли сбить дрон над охраняемым объектом?","a":"Да: пресекать работу беспилотников — подавлять сигналы, воздействовать на пульты, повреждать или уничтожать аппарат.","r":"ФЗ гл. 4 ст. 3 ч. 14"},{"id":"D05","tp":"Обязанности и права","lv":2,"q":"Первое лицо поручило сотруднику ФСО то, что противоречит закону. Исполнять?","a":"Нет. Поручения первых лиц выполняются, только если не противоречат законодательству РО.","r":"ФЗ гл. 4 ст. 3 ч. 9"},{"id":"D06","tp":"Обязанности и права","lv":2,"q":"Обязана ли ФСО раскрыть МВД, где сейчас Премьер-министр?","a":"Нет. Местонахождение первых лиц раскрывается только по решению суда, требованию прокурора или следователя СК либо решению Премьер-министра.","r":"ФЗ гл. 5 ст. 1 ч. 7"},{"id":"D07","tp":"Обязанности и права","lv":1,"q":"Какую информацию ФСО вправе требовать от других госструктур?","a":"Любую информацию, связанную с безопасностью первых лиц и Правительства РО.","r":"ФЗ гл. 5 ст. 1 ч. 7"},{"id":"D08","tp":"Обязанности и права","lv":2,"q":"Что ФСО делает при прокурорской проверке госорганизации?","a":"Поддерживает сотрудников Минюста: полный досмотр сотрудников проверяемой организации, проверка на опьянение, меры к нарушителям.","r":"ФЗ гл. 5 ст. 1 чч. 2–2.1"},{"id":"D09","tp":"Обязанности и права","lv":2,"q":"Нужно ли согласование, чтобы ФСО воспользовалась аэропортом Армии?","a":"Да — с Премьер-министром, Председателем Правительства или высшим руководством Армии. Прочие аэропорты и порты — бесплатно без согласования.","r":"ФЗ гл. 5 ст. 1 ч. 8"},{"id":"D10","tp":"Обязанности и права","lv":1,"q":"Куда сотрудник ФСО проходит беспрепятственно при сопровождении?","a":"На любые территории, куда имеет доступ сопровождаемое первое лицо.","r":"ФЗ гл. 5 ст. 1 ч. 9"},{"id":"D11","tp":"Обязанности и права","lv":1,"q":"Может ли ФСО привлекать другие госорганы к охране?","a":"Да, к подготовке и проведению охранных мероприятий в пределах их полномочий.","r":"ФЗ гл. 4 ст. 3 ч. 11"},{"id":"Z01","tp":"Задержание и подследственность","lv":1,"q":"Кого и где сотрудник ФСО вправе задержать?","a":"Подозреваемого в преступлении на охраняемом объекте или трассе проезда охраняемого, в том числе мешающего движению охраняемого или кортежа.","r":"УПК ст. 92 ч. 10; ФЗ гл. 5 ст. 1 ч. 1"},{"id":"Z02","tp":"Задержание и подследственность","lv":2,"q":"В какой срок ФСО передаёт задержанного, если дело не её подследственности?","a":"По УПК — в течение 15 минут органу внутренних дел, ФСБ или иному уполномоченному органу, иначе задержание прекращается. В ФЗ «О ФСО» указано 20 минут — действует процедура УПК.","r":"УПК ст. 92 ч. 10; ФЗ гл. 5 ст. 1 ч. 1"},{"id":"Z03","tp":"Задержание и подследственность","lv":2,"q":"Какие действия ФСО выполняет при задержании по «чужому» делу?","a":"Только пункты «а», «в», «г», «д», «д.1», «е» ч. 1 ст. 92 УПК; остальное — орган, которому передан задержанный.","r":"УПК ст. 92 ч. 12"},{"id":"Z04","tp":"Задержание и подследственность","lv":1,"q":"Что делать с нарушителем (не преступление) на трассе проезда?","a":"Доставить в служебное помещение органа внутренних дел или иное служебное помещение.","r":"ФЗ гл. 5 ст. 1 ч. 1"},{"id":"Z05","tp":"Задержание и подследственность","lv":2,"q":"Какие дела подследственны дознавателям ФСО?","a":"О преступлениях, выявленных при охране и сопровождении охраняемых лиц и объектов, без письменной отчётности, федеральной юрисдикции.","r":"УПК ст. 151"},{"id":"Z06","tp":"Задержание и подследственность","lv":2,"q":"Какие дела ФСО не ведёт, даже если выявила при охране?","a":"О преступлениях Премьер-министра, Вице-премьера, членов Кабинета и должностных лиц Правительства, а также по ст. 299 и 315 УК.","r":"УПК ст. 151"},{"id":"Z07","tp":"Задержание и подследственность","lv":1,"q":"С какого момента считается срок задержания после передачи?","a":"С момента фактического задержания сотрудником, передавшим задержанного.","r":"УПК ст. 92 ч. 13"},{"id":"F01","tp":"Сила и оружие","lv":1,"q":"Когда сотрудник ФСО применяет физическую силу?","a":"Для пресечения преступлений и правонарушений, задержания, преодоления противодействия законным требованиям — если без силы не обойтись.","r":"ФЗ гл. 5 ст. 2 ч. 1"},{"id":"F02","tp":"Сила и оружие","lv":1,"q":"Что сотрудник ФСО вправе иметь при себе на службе?","a":"Огнестрельное оружие, средства индивидуальной защиты, спецсредства государственного образца.","r":"ФЗ гл. 5 ст. 2 ч. 2"},{"id":"F03","tp":"Сила и оружие","lv":1,"q":"Когда ФСО открывает огонь на поражение?","a":"При прямой угрозе жизни охраняемых лиц — по ст. 3.5 Закона об оружии — и в иных случаях по закону.","r":"ФЗ гл. 5 ст. 2 ч. 4"},{"id":"F04","tp":"Сила и оружие","lv":2,"q":"Когда ФСО вправе прицеливаться в человека?","a":"При охране объектов и лиц — когда это объективно необходимо, чтобы пресечь посягательство или предотвратить угрозу охраняемому.","r":"Оруж. ст. 3.4 «г»"},{"id":"F05","tp":"Сила и оружие","lv":2,"q":"Может ли сотрудник ФСБ прицеливаться по правилам ФСО?","a":"Только если содействует ФСО или сам сопровождает первых лиц государства.","r":"Оруж. ст. 3.4 «г»"},{"id":"F06","tp":"Сила и оружие","lv":1,"q":"Какое оружие ФСО вправе применять?","a":"Огнестрельное летального и нелетального действия — против лиц, совершающих противоправное деяние, по закону.","r":"ФЗ гл. 4 ст. 3 ч. 10"},{"id":"A01","tp":"Допуски и территории","lv":1,"q":"Имеет ли ФСО свободный доступ на закрытые территории?","a":"Да — органы ФСО, осуществляющие сопровождение и охрану первых лиц или иных охраняемых. Сопровождающие должны находиться рядом с охраняемым.","r":"Терр. ст. 2.3"},{"id":"A02","tp":"Допуски и территории","lv":2,"q":"Когда ФСО может войти в жилое помещение и провести обыск?","a":"Только при ордере, постановлении Генерального прокурора или судебном решении.","r":"Терр. ст. 2.17"},{"id":"A03","tp":"Допуски и территории","lv":2,"q":"Кто проводит допрос по делу, где ФСО задержала человека в помещении?","a":"Следователь СК или в его присутствии — по ст. 187 УПК.","r":"Терр. ст. 2.17"},{"id":"A04","tp":"Допуски и территории","lv":2,"q":"Кому ФСО сообщает точные сведения об объекте задержания на закрытой территории?","a":"Только руководству организации; при сомнениях — незамедлительно разъяснить причины нахождения.","r":"Терр. ст. 2.17"},{"id":"A05","tp":"Допуски и территории","lv":1,"q":"Кто может находиться на охраняемой территории?","a":"Любой гражданин при законном основании; сотрудник организации или правоохранительного органа может потребовать подтвердить основание.","r":"Терр. ст. 1.1"},{"id":"A06","tp":"Допуски и территории","lv":2,"q":"Перечислите закрытые территории, которые относятся к Правительству.","a":"Второй этаж здания Правительства и служебная парковка за КПП (и крыши этих территорий).","r":"Терр. ст. 2.15–2.16"},{"id":"A07","tp":"Допуски и территории","lv":1,"q":"Может ли ФСО выписать ордер на обыск транспортного средства?","a":"Да, ФСО в перечне уполномоченных; ФСО также исполняет ордера наравне с ФСБ и МВД.","r":"Закон о госдокументах ст. 6.1.1"},{"id":"A08","tp":"Допуски и территории","lv":2,"q":"Кто беспрепятственно проходит на режимный объект?","a":"Премьер, Вице-премьер, Генпрокурор и его заместители, а также сотрудники организации-владельца; остальных можно обыскать при входе по УПК.","r":"Терр. ст. 3.2–3.5"},{"id":"R01","tp":"Тайна, ответственность, жалобы","lv":1,"q":"Что нельзя разглашать о первых лицах?","a":"Любую информацию — без письменного согласия Премьер-министра или Председателя Правительства, кроме случаев по закону.","r":"ФЗ гл. 1 ст. 1 ч. 5"},{"id":"R02","tp":"Тайна, ответственность, жалобы","lv":2,"q":"Кто может получить сведения о личном составе ФСО?","a":"Только по решению руководства ФСО, Председателя Правительства, Премьер-министра, суда, по требованию прокурора или следователя.","r":"ФЗ гл. 1 ст. 1 ч. 6"},{"id":"R03","tp":"Тайна, ответственность, жалобы","lv":1,"q":"Куда гражданин может обжаловать действия сотрудника ФСО?","a":"В прокуратуру, Следственный комитет или суд.","r":"ФЗ гл. 2 ст. 2 ч. 4"},{"id":"R04","tp":"Тайна, ответственность, жалобы","lv":1,"q":"За что сотрудник ФСО несёт ответственность?","a":"За неисполнение или ненадлежащее исполнение обязанностей, разглашение сведений и персональных данных об охраняемых и гражданах.","r":"ФЗ гл. 2 ст. 2 ч. 3"},{"id":"R05","tp":"Тайна, ответственность, жалобы","lv":1,"q":"Какой статус у представителей ФСО по закону о неприкосновенности?","a":"Неприкосновенны начальник ФСО и заместитель при исполнении, а также два представителя ФСО, назначенные руководством.","r":"ФЗ «О неприкосновенности» ст. 1.1"}],"cases":[{"id":"FK1","lv":1,"tp":"УСН: Комендатура Кремля","s":"На КПП здания Правительства мужчина без пропуска требует пройти на второй этаж: «Я к министру, он меня ждёт». Документов нет, по рации министр не отвечает.","k":["2-й этаж здания Правительства — закрытая территория (Терр. ст. 2.15)","Доступ — по перечню ст. 2.3 или по приглашению лица из перечня (ст. 2.9); приглашение не подтверждено","Комендатура требует соблюдения пропускного режима и проверяет основания (ФЗ гл. 3 ст. 2)","Не пускать; при попытке прорваться — пресечь, при признаках преступления — задержать по УПК и передать по подследственности"]},{"id":"FK2","lv":1,"tp":"УСН: спецсопровождение (ОС)","s":"Кортеж Председателя Правительства едет к мэрии. Таксист перегородил дорогу и отказывается уезжать, снимает кортеж на телефон.","k":["ОС вправе временно ограничить движение на пути кортежа (ФЗ гл. 3 ст. 3 ч. 2 «в»)","Человек, мешающий движению охраняемого, может быть задержан (УПК ст. 92 ч. 10)","Съёмку можно потребовать прекратить, но изымать или удалять видео нельзя (ФЗ гл. 4 ст. 3 ч. 13)","Не подследственно ФСО — передать МВД или ФСБ в течение 15 минут (УПК)"]},{"id":"FK3","lv":2,"tp":"УСН: СБ Премьер-министра","s":"Перед выступлением Премьер-министра на площади СБП получает анонимное сообщение о взрывчатке в сумке у одного из зрителей.","k":["Ввести усиленные меры безопасности при угрозе (ФЗ гл. 3 ст. 4 ч. 2 «б»)","Личный досмотр граждан и вещей на мероприятии с Премьером (ч. 2 «г»)","Подозрительный предмет — диагностика, эвакуация, уничтожение (гл. 4 ст. 3 ч. 4)","Охраняемого — эвакуировать; угрозу — пресечь; подозреваемого задержать по УПК"]},{"id":"FK4","lv":2,"tp":"Обязанности и права","s":"Следователь МВД звонит в ФСО: «Скажите, где сейчас Премьер-министр, мне нужно вручить ему повестку».","k":["ФСО вправе не раскрывать местонахождение первых лиц (ФЗ гл. 5 ст. 1 ч. 7)","Исключения: решение суда, требование прокурора или следователя СК, решение Премьер-министра","Следователь МВД в исключения не входит — отказать","Расследование в отношении Премьера — вне компетенции ФСО (гл. 4 ст. 1 ч. 3.4)"]},{"id":"FK5","lv":3,"tp":"УСБ: ВР и ОК","s":"ОК во время внезапной проверки поста Комендатуры видит, что сотрудник берёт деньги за пропуск посетителя без документов.","k":["ОК проводит внезапные проверки и антикоррупционные мероприятия (ФЗ гл. 3 ст. 9)","Признаки нарушения — уведомить начальника УСБ и передать материалы в ВР (ч. 2 «в»)","ВР — служебная проверка, объяснения, представление о временном отстранении (ст. 8)","Признаки преступления (взятка) — материалы в орган по подследственности; пост закрыть другим сотрудником (взаимозамещение)"]},{"id":"FK6","lv":3,"tp":"Задержание и подследственность","s":"На трассе проезда кортежа мужчина бросил камень в машину охраняемого министра и убежал во двор жилого дома, скрылся в квартире.","k":["Посягательство на охраняемое лицо на трассе — ФСО вправе задержать (УПК ст. 92 ч. 10)","Преследование — служебным транспортом госорганов (ФЗ гл. 3 ст. 3 ч. 2 «б»)","Вход в жилище и обыск — только при ордере, постановлении Генпрокурора или решении суда (Терр. ст. 2.17)","Без документа — блокировать, вызвать уполномоченный орган; после задержания — передать в 15 минут, если не подследственно ФСО"]},{"id":"FK7","lv":4,"tp":"Объекты охраны и задачи","s":"ФСО получает доказательства, что один из членов Кабинета Министров передаёт секретные документы иностранной стороне.","k":["Расследовать в отношении члена Кабинета ФСО не вправе (ФЗ гл. 4 ст. 1 ч. 3.4)","Доказательства о преступлении — в СК","Утечка засекреченной информации — пресечь и передать материалы в ФСБ или СК по подследственности (ч. 3.3)","Охрана министра продолжается — отказаться от неё он не может (ч. 2.1); персональные данные не разглашать"]},{"id":"FK8","lv":4,"tp":"УПП: ОПП и стажировка","s":"Кандидат прошёл собеседование в ОПП, но на итоговой аттестации выясняется, что лицензия на оружие просрочена, а в розыске он не числится.","k":["Требование — действующая лицензия на хранение и ношение оружия (ФЗ гл. 2 ст. 1)","ОПП принимает документы и проводит итоговую аттестацию (гл. 3 ст. 6)","Без лицензии стажировку не продолжить и не направить на службу","Предложить продлить лицензию и пройти аттестацию заново; звание после допуска — лейтенант"]}]}</script>
<script>
const API="https://script.google.com/macros/s/AKfycbx6HhW8u7uPeGAW6TNvHeADRfTZkp6RR4D_YaQw1yHubDZZDhswOdulw8TGDHqzzsNy/exec";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
const D=JSON.parse($("data").textContent);
const BY={};D.cards.forEach(c=>BY[c.id]=c);D.cases.forEach(c=>BY[c.id]=Object.assign({kind:"case"},c));
const K={key:ls("fso-key")||"",me:null,tab:"new",exam:null,marks:{},err:"",busy:false,list:null,q:"",staff:null};
const fmt=ms=>{const d=new Date(ms+3*3600e3),p=n=>String(n).padStart(2,"0");return `${p(d.getUTCDate())}.${p(d.getUTCMonth()+1)} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`};
async function api(action,body){ if(!API) throw new Error("Кабинет ещё не подключён");
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,key:K.key},body||{}))});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||"Ошибка"); return j; }
const copy=t=>{try{navigator.clipboard.writeText(t).then(()=>flash("Скопировано"),()=>prompt("Скопируйте:",t))}catch(e){prompt("Скопируйте:",t)}};
function flash(t){const b=document.createElement("div");b.textContent=t;b.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 14px;font-weight:700;z-index:9";document.body.appendChild(b);setTimeout(()=>b.remove(),1400)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* вариант: 10 базовых (по 1), 6 посложнее (по 2), 2 задачи (по 3) — темы не повторяются, пока это возможно */
function pick(){const byTopic=lv=>{const m={};D.cards.filter(c=>c.lv===lv).forEach(c=>(m[c.tp]=m[c.tp]||[]).push(c));return m};
  const take=(lv,n)=>{const m=byTopic(lv),tps=shuffle(Object.keys(m)),out=[];let round=0;while(out.length<n&&round<10){for(const t of tps){if(out.length>=n)break;const pool=m[t].filter(c=>!out.includes(c));if(pool.length)out.push(shuffle(pool)[0])}round++}return out};
  const easy=take(1,10).map(c=>({id:c.id,pts:1,kind:"q"})),hard=take(2,6).map(c=>({id:c.id,pts:2,kind:"q"}));
  const lo=shuffle(D.cases.filter(c=>c.lv<=2))[0],hi=shuffle(D.cases.filter(c=>c.lv>=3))[0];
  return easy.concat(hard,[{id:lo.id,pts:3,kind:"case"},{id:hi.id,pts:3,kind:"case"}]);}
const MAXP=10+12+6, PASSP=20;

/* ---------- публичная страница ---------- */
function publicHtml(){return `<h1>Экзамен ФСО</h1><p class="eyebrow">ФСО РО · УПП · отдел первичной подготовки</p>
<div class="kpis"><div class="kpi"><b>18</b><span>пунктов</span></div><div class="kpi"><b>${MAXP}</b><span>баллов</span></div><div class="kpi"><b>15</b><span>минут</span></div><div class="kpi"><b>${PASSP}</b><span>чтобы сдать</span></div></div>
<div class="acts"><a class="btn pri" href="trener/">Открыть тренажёр</a><button type="button" class="btn" data-a="login">Вход для экзаменаторов</button></div>
<h2>Как проходит</h2><div class="steps"><div class="step"><b>01</b><span>Подготовка в тренажёре</span></div><div class="step"><b>02</b><span>Запись к экзаменатору</span></div><div class="step"><b>03</b><span>Ссылка-билет, 15 минут</span></div><div class="step"><b>04</b><span>Итог и направление в отдел</span></div></div>
<h2>Вариант</h2><div class="rows">
<div class="row"><span><b>1–10 · базовые вопросы</b><small>по 1 баллу, разные темы: статус, структура, отделы, полномочия, допуски</small></span><span class="mono">10</span></div>
<div class="row"><span><b>11–16 · посложнее</b><small>по 2 балла</small></span><span class="mono">12</span></div>
<div class="row"><span><b>17–18 · задачи</b><small>уровень 1–2 и 3–4, по 3 балла: норма → исключения → порядок действий → вывод</small></span><span class="mono">6</span></div>
<div class="row"><span><b>Оценка</b><small>верно — полный балл, частично — половина, нет — 0. Сдал — от ${PASSP} из ${MAXP}. Пересдача — через 24 часа</small></span><span class="mono">70%</span></div></div>
<h2>Кто принимает</h2><div class="rows" id="staff">${staffHtml()}</div>`}
function staffHtml(){if(!K.staff)return `<div class="row"><span class="note">${API?"Загружаю…":"Состав появится после подключения кабинета."}</span></div>`;
  if(!K.staff.length)return `<div class="row"><span class="note">Список экзаменаторов пока пуст.</span></div>`;
  return K.staff.map(s=>{const p=s.name.split("|").map(x=>x.trim());return `<div class="row"><span><b>${esc(p.length>=2?p[1]:p[0])}</b><small>${esc(p.length>=2?p[0]:s.role)}</small></span><span class="mono">${esc(p[2]||"")}</span></div>`}).join("")}
function loginHtml(){return `<form id="login" class="box" style="margin-top:16px"><label>Личный ключ экзаменатора<input type="password" id="key" autocomplete="off" spellcheck="false" placeholder="FSO-XXXX-XXXX-XXXX-XXXX"></label>${K.err?`<p class="err">${esc(K.err)}</p>`:""}<div class="acts"><button class="btn pri" ${K.busy?"disabled":""}>Войти</button><button type="button" class="btn" data-a="cancel">Отмена</button></div></form>`}

/* ---------- кабинет ---------- */
function cabHtml(){const p=K.me.name.split("|").map(x=>x.trim());
  let h=`<div class="me"><span><span class="l">Кабинет · ${esc(K.me.role)}</span><b>${esc(p.length>=2?p[1]:p[0])}</b> <span class="mono note">${esc(p[2]||"")}</span></span><button type="button" class="btn" data-a="logout">Выйти</button></div>
<nav class="seg"><button type="button" data-tab="new" aria-pressed="${K.tab==="new"}">${K.exam&&K.exam.status!=="завершён"?"Идёт экзамен ●":"Новый экзамен"}</button><button type="button" data-tab="list" aria-pressed="${K.tab==="list"}">Экзамены</button></nav>`;
  if(K.tab==="list") return h+listHtml();
  if(!K.exam) return h+`<form id="create" class="box"><label>Кандидат: имя | статик<input type="text" id="who" maxlength="40" autocomplete="off" placeholder="Иван Петров | 12345" value="${esc(K.whoDraft||"")}"></label>${K.me.chief?`<label class="note" style="display:flex;gap:8px;font-weight:500"><input type="checkbox" id="early"> Пересдача досрочно (только начальник)</label>`:""}${K.err?`<p class="err">${esc(K.err)}</p>`:""}<div class="acts"><button class="btn pri" ${K.busy?"disabled":""}>Сформировать вариант</button></div><p class="note">18 пунктов: 10 базовых, 6 посложнее, 2 задачи. Кандидат получит ссылку-билет — вопросы откроются, когда вы нажмёте «Начать».</p></form>`;
  const e=K.exam, link=location.origin+location.pathname+"#bilet-"+e.code;
  if(e.status==="завершён") return h+resultHtml(e);
  if(!e.start) return h+`<div class="box"><p class="note mono">Вариант ${esc(e.code)}</p><p><b>${esc(e.cadet)}</b> · статик ${esc(e.static)}</p><p class="note">Отправьте кандидату ссылку-билет и нажмите «Начать», когда он её откроет.</p><pre>${esc(link)}</pre><div class="acts"><button type="button" class="btn" data-a="copylink">Скопировать ссылку</button><button type="button" class="btn pri" data-a="start" ${K.busy?"disabled":""}>Начать · 15 минут</button><button type="button" class="btn" data-a="drop">Отложить</button></div>${K.err?`<p class="err">${esc(K.err)}</p>`:""}</div>`;
  const got=sum(e);
  return h+`<div class="timer" id="timer"><span><span class="note mono">${esc(e.code)} · ${esc(e.cadet)}</span></span><b id="tleft">--:--</b></div>
<div class="rows">${e.items.map((it,i)=>itemHtml(it,i)).join("")}</div>
<div class="box"><p><b>Сейчас: ${got.p} из ${got.m}</b> · оценено ${got.n} из ${e.items.length} · сдал — от ${PASSP}</p><label style="font-weight:600">Комментарий (необязательно)<textarea id="comment" rows="2" maxlength="500">${esc(K.comment||"")}</textarea></label>${K.err?`<p class="err">${esc(K.err)}</p>`:""}<div class="acts"><button type="button" class="btn pri" data-a="finish" ${K.busy||got.n<e.items.length?"disabled":""}>Завершить и записать</button></div>${got.n<e.items.length?`<p class="note">Оцените все пункты, чтобы завершить.</p>`:""}</div>`}
function sum(e){let p=0,m=0,n=0;e.items.forEach(it=>{m+=it.pts;const v=K.marks[it.id];if(v!==undefined){n++;p+=v*it.pts}});return{p,m,n}}
function itemHtml(it,i){const c=BY[it.id]||{q:"?",a:"",r:""},v=K.marks[it.id];
  const body=it.kind==="case"?`<p class="q">${esc(c.s)}</p><details><summary>Ключ задачи</summary><ol>${(c.k||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`:`<p class="q">${esc(c.q)}</p><details><summary>Ответ</summary><p class="a">${esc(c.a)}<small>${esc(c.r)}</small></p></details>`;
  return `<div class="it ${v===1?"s1":v===0.5?"s05":v===0?"s0":""}"><div class="hd"><span>${String(i+1).padStart(2,"0")} · ${it.kind==="case"?"задача, ур. "+c.lv:esc(c.tp)}</span><span>${it.pts} б.</span></div>${body}<div class="gr" role="group">${[[1,it.kind==="case"?"Засчитан":"Верно"],[0.5,it.kind==="case"?"Доработка":"Частично"],[0,it.kind==="case"?"Не засчитан":"Нет"]].map(([x,t])=>`<button type="button" data-mark="${it.id}" data-v="${x}" aria-pressed="${v===x}">${t}</button>`).join("")}</div></div>`}
function report(e){return `Экзамен ФСО · ${e.code}\nКандидат: ${e.cadet} | ${e.static}\nИтог: ${e.verdict} — ${e.points} из ${e.max}\nКогда: ${fmt(e.finished||Date.now())} МСК`}
function resultHtml(e){return `<div class="box"><p class="note mono">Вариант ${esc(e.code)} · ${esc(e.cadet)} | ${esc(e.static)}</p><p class="res ${e.verdict==="сдал"?"ok-t":"bad-t"}">${e.points} / ${e.max}</p><p><b>${e.verdict==="сдал"?"Сдал":"Не сдал"}</b>${e.verdict==="сдал"?" — направить в доступное подразделение (ФЗ гл. 3 ст. 6)":" — пересдача через 24 часа"}</p><pre>${esc(report(e))}</pre><div class="acts"><button type="button" class="btn" data-a="copyrep">Скопировать отчёт</button><button type="button" class="btn pri" data-a="new">Новый экзамен</button></div></div>`}
function listHtml(){return `<form id="find" class="box"><label>Поиск: статик, имя или вариант<input type="search" id="fq" value="${esc(K.q)}" autocomplete="off"></label><div class="acts"><button class="btn pri">Найти</button></div></form><div class="rows">${!K.list?`<div class="row"><span class="note">${K.err?esc(K.err):"Загружаю…"}</span></div>`:K.list.length?K.list.map(x=>`<div class="row"><span><b>${esc(x.cadet)}</b> <span class="mono note">${esc(x.static)}</span><small>${esc(x.code)} · ${fmt(x.created)} · ${esc(x.examiner)}</small></span><span class="mono ${x.verdict==="сдал"?"ok-t":x.verdict?"bad-t":"note"}">${x.status==="завершён"?x.points+"/"+x.max:esc(x.status)}</span></div>`).join(""):`<div class="row"><span class="note">Ничего не найдено</span></div>`}</div>`}

/* ---------- билет кандидата ---------- */
let TT=null;
async function ticketView(code){const app=$("app");
  const draw=t=>{if(!t){app.innerHTML=`<h1>Билет</h1><p class="err">Билет не найден. Проверьте ссылку.</p>`;return}
    let h=`<h1>Билет ${esc(t.code)}</h1><p class="eyebrow">Кандидат: ${esc(t.cadet)}</p>`;
    if(t.status==="завершён"){h+=`<div class="box"><p class="res ${t.verdict==="сдал"?"ok-t":"bad-t"}">${t.points} / ${t.max}</p><p><b>${t.verdict==="сдал"?"Экзамен сдан":"Экзамен не сдан — пересдача через 24 часа"}</b></p></div>`;app.innerHTML=h;return true}
    if(!t.start){h+=`<div class="box"><p><b>Ждите.</b> Экзаменатор начнёт экзамен — вопросы появятся здесь сами.</p><p class="note">Отвечайте устно, своими словами, без подсказок.</p></div>`;app.innerHTML=h;return}
    const left=Math.max(0,t.start+t.limit*60e3-Date.now());
    h+=`<div class="timer ${left?"":"over"}"><span class="note">Осталось</span><b>${String(Math.floor(left/60e3)).padStart(2,"0")}:${String(Math.floor(left%60e3/1e3)).padStart(2,"0")}</b></div><div class="rows">${t.items.map((it,i)=>{const c=BY[it.id]||{};return `<div class="it"><div class="hd"><span>${String(i+1).padStart(2,"0")} · ${it.kind==="case"?"задача":"вопрос"}</span><span>${it.pts} б.</span></div><p class="q">${esc(it.kind==="case"?c.s:c.q)}</p></div>`}).join("")}</div>`;
    app.innerHTML=h;};
  let t=null;const load=async()=>{try{t=(await api("ticket",{code})).ticket}catch(e){t=null}if(draw(t)===true)clearInterval(TT)};
  await load();TT=setInterval(load,5000);setInterval(()=>{if(t&&t.start&&t.status!=="завершён")draw(t)},1000);}

/* ---------- отрисовка и события ---------- */
let TIM=null;
function render(){const app=$("app");
  if(!K.me){app.innerHTML=(K.showLogin?loginHtml():"")+publicHtml();if(K.showLogin){const k=$("key");if(k)k.focus()}if(K.staff===null&&API&&!K.staffLoading){K.staffLoading=true;api("staff").then(j=>{K.staff=j.staff;render()}).catch(()=>{K.staff=[];render()})}return}
  app.innerHTML=cabHtml();clearInterval(TIM);
  if(K.exam&&K.exam.start&&K.exam.status!=="завершён"){const tick=()=>{const el=$("tleft");if(!el)return;const left=K.exam.start+15*60e3-Date.now();el.textContent=left>0?`${String(Math.floor(left/60e3)).padStart(2,"0")}:${String(Math.floor(left%60e3/1e3)).padStart(2,"0")}`:"время вышло";$("timer").classList.toggle("over",left<=0)};tick();TIM=setInterval(tick,1000)}}
function saveOpen(){ls("fso-open",K.exam&&K.exam.status!=="завершён"?JSON.stringify({code:K.exam.code,marks:K.marks,comment:K.comment||""}):null)}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a],[data-tab],[data-mark]");if(!b)return;
  if(b.dataset.tab){K.tab=b.dataset.tab;K.err="";if(K.tab==="list"&&!K.list){render();try{K.list=(await api("list",{q:K.q})).items}catch(er){K.err=er.message}}render();return}
  if(b.dataset.mark){const id=b.dataset.mark,v=+b.dataset.v;K.marks[id]=K.marks[id]===v?undefined:v;if(K.marks[id]===undefined)delete K.marks[id];const c=$("comment");if(c)K.comment=c.value;saveOpen();const y=scrollY;render();scrollTo(0,y);return}
  const a=b.dataset.a;
  if(a==="login"){K.showLogin=true;K.err="";render();scrollTo(0,0)}
  if(a==="cancel"){K.showLogin=false;K.err="";render()}
  if(a==="logout"){K.key="";K.me=null;ls("fso-key",null);render()}
  if(a==="copylink")copy(location.origin+location.pathname+"#bilet-"+K.exam.code);
  if(a==="copyrep")copy(report(K.exam));
  if(a==="new"||a==="drop"){K.exam=null;K.marks={};K.comment="";K.err="";saveOpen();render()}
  if(a==="start"){K.busy=true;K.err="";render();try{K.exam=(await api("start",{code:K.exam.code})).exam}catch(er){K.err=er.message}K.busy=false;saveOpen();render()}
  if(a==="finish"){const c=$("comment");K.comment=c?c.value:"";K.busy=true;K.err="";render();try{K.exam=(await api("grade",{code:K.exam.code,marks:K.marks,comment:K.comment})).exam;K.list=null}catch(er){K.err=er.message}K.busy=false;saveOpen();render();scrollTo(0,0)}
});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;
  if(f.id==="login"){const k=$("key").value.trim().toUpperCase();if(!k)return;K.key=k;K.busy=true;K.err="";render();try{const j=await api("login");K.me=j;ls("fso-key",k);const o=ls("fso-open");if(o){const x=JSON.parse(o);try{K.exam=(await api("get",{code:x.code})).exam;K.marks=x.marks||{};K.comment=x.comment||""}catch(_){ls("fso-open",null)}}}catch(er){K.key="";K.err=er.message}K.busy=false;K.showLogin=!K.me;render();return}
  if(f.id==="create"){const raw=$("who").value;K.whoDraft=raw;const m=raw.split("|").map(s=>s.trim());if(m.length!==2||!m[0]||!/^\d{1,7}$/.test(m[1])){K.err="Формат: Имя Фамилия | статик";render();return}
    K.busy=true;K.err="";render();try{K.exam=(await api("create",{cadet:m[0],static:m[1],items:pick(),early:!!($("early")&&$("early").checked)})).exam;K.marks={};K.comment="";K.whoDraft="";K.list=null}catch(er){K.err=er.message}K.busy=false;saveOpen();render();return}
  if(f.id==="find"){K.q=$("fq").value;K.list=null;render();try{K.list=(await api("list",{q:K.q})).items}catch(er){K.err=er.message}render()}
});
(async()=>{const m=location.hash.match(/^#bilet-(FS-[A-Z0-9]{6})$/i);if(m){ticketView(m[1].toUpperCase());return}
  if(K.key&&API){try{K.me=await api("login");const o=ls("fso-open");if(o){const x=JSON.parse(o);try{K.exam=(await api("get",{code:x.code})).exam;K.marks=x.marks||{};K.comment=x.comment||""}catch(_){ls("fso-open",null)}}}catch(e){K.key="";ls("fso-key",null)}}
  render()})();
</script>
