<script type="application/json" id="data">{"inn": [{"h": "ГЛАВА I. ОБЩИЕ ПОЛОЖЕНИЯ", "a": [{"n": "Статья 1", "t": "Государственная инспекция безопасности дорожного движения", "p": ["1.1. Государственная инспекция безопасности дорожного движения (далее — ГИБДД) является органом региональной правоохранительной структуры, взаимодействующим с Министерством внутренних дел РО в пределах разграниченной компетенции (пункт 1.5 Федерального закона «О полиции»), и осуществляет деятельность в сфере обеспечения безопасности дорожного движения, контроля за соблюдением законодательства в установленной сфере и выполнения иных возложенных на неё задач.", "1.2. Непосредственное руководство ГИБДД осуществляет Министр внутренних дел РО (подпункт «б» части 3 статьи 8 главы III Федерального конституционного закона «О Правительстве РО»). Сотрудники ГИБДД подчиняются вышестоящим должностным лицам ГИБДД и руководству Министерства внутренних дел РО, а также действуют в рамках полномочий, определяемых Правительством РО (пункт 1.7 Федерального закона «О полиции»)."]}, {"n": "Статья 2", "t": "Наименование", "p": ["2.1. Полное наименование организации: Государственная инспекция безопасности дорожного движения.", "2.2. Сокращённое наименование: ГИБДД."]}, {"n": "Статья 3", "t": "Роль Устава", "p": ["3.1. Настоящий Устав является внутренним трудовым распорядком ГИБДД в значении статьи 28.1 Трудового кодекса РО, определяющим общие права и обязанности сотрудников, порядок служебного взаимодействия, требования к служебной дисциплине, субординации и внутреннему порядку, а также общие принципы деятельности ГИБДД и её структурных подразделений.", "3.2. Положения настоящего Устава обязательны для исполнения всеми сотрудниками ГИБДД независимо от занимаемой должности, специального звания, срока службы и структурной принадлежности.", "3.3. Настоящий Устав применяется во взаимосвязи с законодательством РО, Кодексом этики и служебного поведения государственных служащих РО, Трудовым кодексом РО, Дисциплинарным уставом ГИБДД и иными внутренними нормативными актами ГИБДД. При противоречии настоящего Устава законодательству РО применяется законодательство РО."]}, {"n": "Статья 4", "t": "Обязательность исполнения", "p": ["4.1. Настоящий Устав обязателен к исполнению всеми сотрудниками ГИБДД независимо от должности или специального звания.", "4.2. Положение о работе отдела собственной безопасности ГИБДД является локальным нормативным актом ГИБДД, регулирующим деятельность Отдела собственной безопасности (ОСБ), и утверждается в порядке, установленном статьёй 28.1 Трудового кодекса РО. До утверждения указанного Положения в установленном порядке меры дисциплинарного воздействия, предусмотренные им, не применяются.", "4.3. Незнание положений настоящего Устава, иных нормативных актов и установленных требований не освобождает сотрудника от ответственности за их нарушение."]}, {"n": "Статья 5", "t": "Порядок внесения изменений", "p": ["5.1. Изменения и дополнения в настоящий Устав вносятся Начальником ГИБДД и его заместителями и направляются в Генеральную прокуратуру РО для проверки соответствия законодательству.", "5.2. Изменения и дополнения наделяются юридической силой только после их подписания Генеральным прокурором РО (статья 28.1 Трудового кодекса РО)."]}, {"n": "Статья 6", "t": "Местонахождение ГИБДД", "p": ["6.1. ГИБДД находится по адресу: г. Москва, ул. Остоженка, 53/2."]}, {"n": "Статья 7", "t": "Юридический статус", "p": ["7.1. ГИБДД является органом региональной правоохранительной структуры, непосредственное руководство которым осуществляет Министр внутренних дел РО (статья 1 настоящего Устава)."]}]}, {"h": "ГЛАВА II. ПОРЯДОК ПРИЁМА И УВОЛЬНЕНИЯ", "a": [{"n": "Статья 8", "t": "Поступление в Академию ГИБДД", "p": ["8.1. Поступление в Академию ГИБДД осуществляется:", "8.1.1. путём подачи электронной заявки в установленном порядке;", "8.1.2. по результатам публичного набора, объявленного в средствах массовой информации;", "8.1.3. путём перевода из иных силовых государственных структур."]}, {"n": "Статья 9", "t": "Основания и порядок увольнения", "p": ["9.1. Увольнение сотрудника ГИБДД производится по следующим основаниям:", "9.1.1. по собственному желанию на основании рапорта (статьи 38 и 39 Трудового кодекса РО);", "9.1.2. существенное и (или) неоднократное нарушение настоящего Устава и иных внутренних нормативных актов ГИБДД, в том числе действия, дискредитирующие ГИБДД или иные государственные органы (подпункт «а» статьи 43 Трудового кодекса РО);", "9.1.3. существенное и (или) неоднократное нарушение законодательства РО (подпункт «б» статьи 43 Трудового кодекса РО);", "9.1.4. недолжное исполнение сотрудником своих обязанностей (подпункт «в» статьи 43 Трудового кодекса РО);", "9.1.5. прогул рабочего дня (подпункт «г» статьи 43 Трудового кодекса РО);", "9.1.6. явка на службу в состоянии алкогольного опьянения или в состоянии, вызванном употреблением наркотических и (или) психотропных веществ (подпункт «д» статьи 43 Трудового кодекса РО);", "9.1.7. разжигание конфликтов внутри ГИБДД либо между организациями (подпункт «е» статьи 43 Трудового кодекса РО);", "9.1.8. отсутствие на рабочем месте от 7 рабочих дней и более (подпункт «ж» статьи 43 Трудового кодекса РО);", "9.1.9. постановление или иной акт, изданный надзорным органом (подпункт «з» статьи 43 Трудового кодекса РО);", "9.1.10. по иным основаниям, прямо установленным законодательством РО.", "9.2. Порядок увольнения:", "9.2.1. При увольнении по собственному желанию сотрудник подаёт рапорт на имя непосредственного руководителя с указанием желаемой даты увольнения. Рапорт рассматривается в течение 24 часов. Отказ в увольнении по собственному желанию не допускается (статьи 38 и 39 Трудового кодекса РО), за исключением случаев, предусмотренных статьями 37 и 42 Трудового кодекса РО.", "9.2.2. При увольнении по инициативе руководства оформляется служебная записка с изложением оснований. При необходимости проводится служебная проверка.", "9.2.3. Решение об увольнении по инициативе руководства принимает Начальник ГИБДД либо его заместитель (статьи 9 и 9.1 Трудового кодекса РО).", "9.2.4. Увольнение за нарушение настоящего Устава, систематическое неисполнение обязанностей либо иные дисциплинарные проступки производится в порядке, установленном Дисциплинарным уставом ГИБДД, в пределах оснований пункта 9.1 настоящего Устава.", "9.2.5. Внесение уволенного сотрудника в чёрный список ГИБДД допускается за существенные нарушения внутреннего трудового распорядка либо за совершение преступления и (или) административного правонарушения; решение должно быть обоснованно (статья 33 Трудового кодекса РО).", "9.2.6. Уволенному сотруднику предоставляется соответствующий приказ об увольнении, а также производятся предусмотренные ему выплаты.", "9.3. Увольнение может быть обжаловано в течение 72 часов через ОСБ, вышестоящее руководство, в Генеральную прокуратуру РО либо в суд (статья 45.2 Трудового кодекса РО).", "9.4. В случае установления незаконности увольнения сотрудник подлежит восстановлению в должности в порядке, установленном законодательством РО (статьи 40 и 50 Трудового кодекса РО)."]}]}, {"h": "ГЛАВА III. ОРГАНИЗАЦИОННО-ШТАТНАЯ СТРУКТУРА", "a": [{"n": "Статья 10", "t": "Руководящий состав ГИБДД", "p": ["10.1. В руководящий состав ГИБДД входят:", "10.1.1. Начальник ГИБДД — специальное звание «Генерал»;", "10.1.2. заместители Начальника ГИБДД — специальное звание «Генерал-полковник»;", "10.1.3. руководитель Отдела собственной безопасности — специальное звание «Генерал-лейтенант»;", "10.1.4. руководители иных отделов — специальное звание «Генерал-лейтенант».", "10.2. Руководством ГИБДД в значении статьи 9.1 Трудового кодекса РО являются Начальник ГИБДД и его заместители. Руководители отделов относятся к старшему составу (статья 9.2 Трудового кодекса РО).", "10.3. Должность и специальное звание являются самостоятельными элементами служебного положения сотрудника. Назначение на должность не влечёт присвоения специального звания, а присвоение специального звания не влечёт назначения на должность.", "10.4. Специальные звания, предусмотренные настоящей статьёй и статьёй 11 настоящего Устава, именуются в соответствии с законодательством РО — «Генерал», «Генерал-полковник», «Генерал-лейтенант», «Генерал-майор», «Полковник», «Подполковник» — без добавления приставки «ГИБДД». Присвоение специальных званий производится в порядке, установленном законодательством РО."]}, {"n": "Статья 11", "t": "Старший офицерский состав", "p": ["11.1. Специальное звание «Генерал-майор» присваивается начальникам отделов:", "11.1.1. Начальник АХО;", "11.1.2. Командир ОСБ;", "11.1.3. Командир СОБР;", "11.1.4. Командир ДПС;", "11.1.5. Командир ДПСм;", "11.1.6. Командир ЦПП.", "11.2. Специальное звание «Полковник» присваивается заместителям командиров отделов:", "11.2.1. Заместитель командира ОСБ;", "11.2.2. Заместитель командира СОБР;", "11.2.3. Заместитель командира ДПС;", "11.2.4. Заместитель командира ДПСм;", "11.2.5. Заместитель командира ЦПП.", "11.3. Специальное звание «Подполковник» присваивается инструкторам отделов:", "11.3.1. Старший оперуполномоченный ОСБ;", "11.3.2. Инструктор СОБР;", "11.3.3. Инструктор ДПС;", "11.3.4. Инструктор ДПСм;", "11.3.5. Инструктор ЦПП."]}, {"n": "Статья 12", "t": "Оперуполномоченные ОСБ", "p": ["12.1. В составе Отдела собственной безопасности устанавливается следующая должностная иерархия оперуполномоченных сотрудников:", "12.1.1. Старший оперуполномоченный ОСБ;", "12.1.2. Оперуполномоченный ОСБ;", "12.1.3. Младший оперуполномоченный ОСБ.", "12.2. Старший оперуполномоченный сотрудник ОСБ осуществляет координацию деятельности оперуполномоченных и младших оперуполномоченных сотрудников ОСБ в пределах предоставленных полномочий.", "12.3. Оперуполномоченный сотрудник ОСБ осуществляет непосредственное выполнение оперативных и контрольных задач ОСБ в пределах предоставленных ему полномочий.", "12.4. Младший оперуполномоченный сотрудник ОСБ осуществляет задачи ОСБ в пределах предоставленной ему компетенции и под руководством старшего состава ОСБ.", "12.5. Конкретные полномочия, порядок деятельности и пределы компетенции сотрудников ОСБ определяются Положением о работе отдела собственной безопасности ГИБДД с учётом пункта 4.2 настоящего Устава и не могут выходить за пределы, установленные законодательством РО."]}]}, {"h": "ГЛАВА IV. ПРАВА, ПОЛНОМОЧИЯ И ОБЯЗАННОСТИ", "a": [{"n": "Статья 13", "t": "Общие права и обязанности", "p": ["13.1. Полномочия сотрудников ГИБДД устанавливаются законодательством РО и реализуются в порядке и пределах, определяемых настоящим Уставом, приказами Начальника ГИБДД и внутренними нормативными актами ГИБДД.", "13.2. Сотрудник обязан осуществлять предоставленные ему полномочия исключительно в пределах своей компетенции.", "13.3. Использование служебного положения в личных целях, для разрешения личных конфликтов, получения личной выгоды либо оказания неправомерного воздействия на иных лиц запрещается."]}, {"n": "Статья 14", "t": "Форма одежды", "p": ["14.1. Внешний вид сотрудника должен соответствовать требованиям, установленным ГИБДД и структурным подразделением, в котором сотрудник проходит службу.", "14.2. Руководство структурных подразделений вправе устанавливать дополнительные требования к форме одежды сотрудников своего подразделения."]}, {"n": "Статья 15", "t": "Исполнение приказов и субординация", "p": ["15.1. Сотрудники ГИБДД обязаны своевременно и неукоснительно исполнять законные приказы и распоряжения непосредственных и вышестоящих руководителей.", "15.2. Сотрудники обязаны соблюдать установленную субординацию и уважительно обращаться с сотрудниками ГИБДД, представителями иных государственных организаций и гражданами.", "15.3. Сотрудники обязаны соблюдать установленный рабочий график.", "Исключение: лица руководящего состава ГИБДД и сотрудники, которым установлен гибкий график работы.", "15.4. Сотрудник может быть отозван из отпуска, отгула, перерыва либо вызван на службу в нерабочее время только в случае возникновения чрезвычайных ситуаций, чрезвычайных происшествий либо по письменному распоряжению курирующего Министерства (статья 20.2 Трудового кодекса РО).", "15.5. Сотрудники обязаны реагировать на служебные вызовы в период исполнения служебных обязанностей.", "15.6. Сотрудники обязаны оказывать помощь гражданам в пределах предоставленных им полномочий.", "15.7. При необходимости оказания медицинской помощи сотрудник обязан принять доступные меры первой помощи либо вызвать медицинскую службу.", "15.8. Сотрудники обязаны присутствовать на обязательных служебных собраниях.", "Исключение: наличие одобрения руководства либо исполнение неотложных служебных обязанностей.", "15.9. Сотрудник обязан пройти установленное обучение и сдать предусмотренные экзамены в установленный срок.", "15.10. Каждый сотрудник обязан соблюдать законодательство РО, настоящий Устав, Дисциплинарный устав ГИБДД, Кодекс этики и служебного поведения государственных служащих РО и иные внутренние нормативные акты ГИБДД.", "15.11. В период проведения внутренних мероприятий сотрудник обязан обеспечивать нахождение служебной радиостанции на установленной рабочей частоте.", "15.12. Сотрудники обязаны проходить установленные курсы повышения квалификации и проверки профессиональных компетенций.", "15.13. Сотрудник, отсутствующий на рабочем месте от 7 рабочих дней и более, может быть уволен решением Начальника ГИБДД либо его заместителя (подпункт «ж» статьи 43 Трудового кодекса РО).", "15.14. Сотрудник обязан хранить видеофиксацию с нагрудного видеорегистратора в течение 72 часов с момента фиксации нарушения либо иного служебно значимого события."]}, {"n": "Статья 16", "t": "Информационная работа", "p": ["16.1. Сотрудники обязаны предоставлять служебные рапорты и отчёты о деятельности в случаях и порядке, установленных внутренними нормативными актами.", "16.2. Формы рапортов утверждаются руководителями структурных подразделений либо Начальником ГИБДД.", "16.3. По требованию ОСБ сотрудник обязан предоставить имеющиеся у него служебные материалы, отчёты и иные сведения, относящиеся к предмету проверки."]}]}, {"h": "ГЛАВА V. ВНУТРЕННИЕ И МЕЖВЕДОМСТВЕННЫЕ МЕРОПРИЯТИЯ", "a": [{"n": "Статья 17", "t": "Участие в мероприятиях", "p": ["17.1. Сотрудники обязаны принимать участие во внутренних мероприятиях, инициированных руководством ГИБДД или структурного подразделения.", "17.2. Во время мероприятий сотрудники обязаны соблюдать установленный порядок, дисциплину и распоряжения руководителя мероприятия.", "17.3. При участии в межведомственных мероприятиях сотрудники обязаны соблюдать порядок взаимодействия между государственными структурами и исполнять законные распоряжения своего руководства."]}, {"n": "Статья 18", "t": "Подготовка и проведение мероприятий", "p": ["18.1. Сотрудник обязан прибыть в организованный строй в течение 10 минут с момента объявления о его проведении.", "18.2. В строю запрещается разговаривать без необходимости, нарушать установленный порядок, самовольно покидать строй либо иным образом препятствовать проведению мероприятия.", "18.3. ОСБ вправе осуществлять контроль соблюдения сотрудниками настоящего Устава во время внутренних и межведомственных мероприятий.", "18.4. В случае проведения мероприятий, имеющих повышенное значение для безопасности личного состава, руководство ОСБ вправе назначить сотрудника ОСБ для непосредственного контроля соблюдения дисциплины и фиксации нарушений.", "18.5. Сотрудник ОСБ, назначенный для контроля мероприятия, вправе временно покинуть строй в объёме, необходимом для исполнения возложенных на него служебных обязанностей."]}]}, {"h": "ГЛАВА VI. ПРАВА, ВЗЫСКАНИЯ И ПООЩРЕНИЯ", "a": [{"n": "Статья 19", "t": "Дисциплинарные взыскания", "p": ["19.1. За совершение дисциплинарного проступка к сотруднику ГИБДД могут применяться только виды дисциплинарных взысканий, предусмотренные статьёй 30.1 Трудового кодекса РО: предупреждение, выговор, понижение в должности, обязательная переаттестация, увольнение.", "19.2. Основания применения взысканий, полномочия должностных лиц, порядок оформления, обжалования, отработки и снятия взысканий устанавливаются Дисциплинарным уставом ГИБДД в пределах Трудового кодекса РО. Выговор, назначенный Генеральной прокуратурой РО, устанавливается на срок от 1 до 7 дней и досрочно не погашается (примечание к подпункту «б» статьи 30.1 Трудового кодекса РО).", "19.3. Дисциплинарное взыскание может быть применено непосредственно за выявленный проступок без предварительного применения менее строгой меры взыскания, если характер и тяжесть нарушения позволяют применить соответствующую меру.", "19.4. Порядок направления сотрудников на переаттестацию, проведения переаттестации и принятия решений по её результатам устанавливается Дисциплинарным уставом ГИБДД и Регламентом переаттестаций без ограничения права Генеральной прокуратуры РО назначать переаттестацию в соответствии со статьёй 51.1 Трудового кодекса РО."]}, {"n": "Статья 20", "t": "Поощрения", "p": ["20.1. За проявленный профессионализм, добросовестное исполнение обязанностей, выполнение важных служебных задач и примерное соблюдение Устава сотрудники могут быть поощрены.", "20.2. К видам поощрения относятся:", "20.2.1. благодарность;", "20.2.2. денежное поощрение;", "20.2.3. иные виды поощрения, предусмотренные статьёй 29.1 Трудового кодекса РО."]}, {"n": "Статья 21", "t": "Права сотрудников", "p": ["Сотрудники ГИБДД имеют право на:", "21.1. ознакомление с приказами, распоряжениями и иными внутренними документами, непосредственно затрагивающими их права и обязанности;", "21.2. получение достоверной информации об условиях службы и требованиях к занимаемой должности;", "21.3. обжалование неправомерных действий или бездействия руководства, в том числе в Генеральную прокуратуру РО;", "21.4. обжалование дисциплинарных взысканий в установленном порядке;", "21.5. защиту чести, достоинства и деловой репутации;", "21.6. предоставление отпуска, отгулов и иных видов отдыха в установленном порядке;", "21.7. медицинскую помощь в предусмотренных законодательством случаях;", "21.8. использование служебного транспорта, средств связи и иного государственного имущества исключительно для выполнения служебных задач;", "21.9. участие в профессиональном обучении и повышении квалификации;", "21.10. обращение к вышестоящему руководству в случае нарушения своих прав;", "21.11. отказ от исполнения заведомо незаконного приказа с обязательным докладом вышестоящему руководителю или ОСБ."]}]}, {"h": "ГЛАВА VII. СУБОРДИНАЦИЯ", "a": [{"n": "Статья 22", "t": "Понятие субординации", "p": ["22.1. Субординация — установленный порядок служебного взаимодействия между руководителями и подчинёнными, старшими и младшими по специальному званию и должностному положению.", "22.2. Соблюдение субординации является обязательным для всех сотрудников ГИБДД.", "22.3. Нарушение установленной субординации является дисциплинарным проступком."]}, {"n": "Статья 23", "t": "Основные принципы субординации", "p": ["23.1. Сотрудник обязан соблюдать законные распоряжения вышестоящего руководства.", "23.2. Каждый сотрудник обязан знать пределы своей компетенции и не вмешиваться в деятельность иных должностных лиц без соответствующих полномочий.", "23.3. Обход непосредственного руководителя допускается в случаях, предусмотренных настоящим Уставом, иными нормативными актами либо при необходимости немедленного обращения в ОСБ или к вышестоящему руководству.", "23.4. Служебное общение осуществляется в официально-деловой форме.", "23.5. Запрещаются панибратство, фамильярность, оскорбления, унижение, пренебрежительный тон и иные формы неуставного общения.", "23.6. В официальной обстановке обращение к сотрудникам осуществляется по специальному званию или должности."]}]}, {"h": "ГЛАВА VIII. ЗАПРЕТЫ", "a": [{"n": "Статья 24", "t": "Основные запреты", "p": ["24.1. Сотруднику ГИБДД запрещается во время исполнения служебных обязанностей посещать места развлечений и иные места, не связанные с выполнением служебных задач.", "24.2. Запрещается нарушать нормы служебной этики и неуважительно обращаться с гражданами, сотрудниками ГИБДД либо представителями иных государственных органов.", "24.3. Запрещается употреблять или хранить алкогольную продукцию во время несения службы.", "24.4. Запрещается хранить и употреблять наркотические и психотропные вещества.", "24.5. Запрещается находиться при исполнении служебных обязанностей в состоянии алкогольного или наркотического опьянения.", "24.6. Запрещается уклоняться от исполнения служебных обязанностей, бездействовать либо намеренно не выполнять поставленные служебные задачи.", "24.7. Запрещается получать любые незаконные вознаграждения за действия, связанные с использованием служебного положения.", "24.8. Запрещается использовать государственное имущество в целях, не связанных со служебной деятельностью.", "24.9. Запрещается использовать личный транспорт при исполнении служебных обязанностей, за исключением случаев, предусмотренных законодательством или приказом руководства.", "24.10. Запрещается использование служебной радиостанции в неслужебных целях.", "24.11. Запрещается игнорировать служебную радиостанцию без уважительной причины.", "24.12. Запрещается игнорировать законные приказы и распоряжения руководства.", "24.13. Запрещается предоставлять руководству заведомо ложную информацию либо намеренно вводить руководство в заблуждение.", "24.14. Запрещается без уважительной причины игнорировать обязательные построения.", "24.15. Сотруднику ГИБДД запрещается совершать действия, а равно допускать высказывания или иное поведение, порочащие честь, достоинство и деловую репутацию сотрудника государственного органа, дискредитирующие ГИБДД, Министерство внутренних дел РО либо подрывающие авторитет государственной службы.", "24.16. Запрещается распространять заведомо ложные сведения о деятельности ГИБДД, её сотрудниках, руководстве либо иных государственных органах, если такие действия способны причинить ущерб авторитету государственной службы.", "24.17. Запрещается использовать служебное положение, специальное звание или должность для разрешения личных конфликтов, сведения личных счётов, получения личной выгоды либо оказания неправомерного давления на иных лиц.", "24.18. Запрещается использовать служебные мотоциклы сотрудникам, не состоящим в Мотобатальоне (ДПСм).", "Исключение: одобрение руководящего состава ДПСм, старшего руководящего состава.", "24.19. Сотрудникам ГИБДД, в том числе сотрудникам ОСБ, запрещается подстрекать к противоправным действиям, в том числе привлекать граждан к передаче сотрудникам ГИБДД денежных средств, предметов либо иных материальных выгод (пункт 2.3 Федерального закона «О полиции»)."]}, {"n": "Статья 25", "t": "Нарушение внутреннего порядка", "p": ["25.1. Сотрудникам, имеющим специальное звание не выше старшего сержанта, запрещается покидать территорию ГИБДД в рабочее время без соответствующего разрешения.", "25.2. Сотрудники вправе покидать территорию ГИБДД в случаях исполнения служебных обязанностей либо с разрешения руководства.", "25.3. Запрещается самовольно входить в кабинеты руководящего состава.", "25.4. Запрещается редактировать поданные рапорты на повышение, отпуск, отгул, запрос склада, а также иные служебные материалы без соответствующих полномочий."]}]}, {"h": "ГЛАВА IX. ГРАФИК РАБОТЫ И ОТПУСКОВ", "a": [{"n": "Статья 26", "t": "Рабочее время", "p": ["26.1. В будние дни рабочий день установлен с 10:00 до 00:00.", "26.2. В выходные дни рабочий день установлен с 10:00 до 21:00.", "26.3. Обеденный перерыв предоставляется с 13:00 до 14:00 и в продолжительность рабочего времени не включается. Продолжительность рабочего времени без учёта обеденного перерыва составляет: в будние дни — 13 часов, в выходные дни — 10 часов, то есть не менее 10 часов в сутки (статья 19.3 Трудового кодекса РО).", "26.4. Руководство ОСБ, ЦПП и СОБР вправе устанавливать иной график работы для сотрудников соответствующего подразделения путём издания письменного приказа при условии соблюдения статьи 19.3 Трудового кодекса РО.", "26.5. При введении режима чрезвычайного или военного положения порядок прохождения службы определяется отдельными приказами руководства ГИБДД.", "26.6. Вне основного рабочего времени в ГИБДД организуется круглосуточное дежурство дежурными сменами по графику, утверждаемому Начальником ГИБДД либо его заместителем (статья 19.1 Трудового кодекса РО)."]}, {"n": "Статья 27", "t": "Отпуска", "p": ["27.1. Сотрудник имеет право на ежемесячный отпуск (статья 20.4 Трудового кодекса РО).", "27.2. Максимальный срок отпуска составляет 7 календарных дней.", "27.3. Отпуск предоставляется с разрешения руководства ГИБДД либо командира соответствующего отдела.", "27.4. Отпуск может быть прерван только в случаях, предусмотренных статьёй 20.2 Трудового кодекса РО и пунктом 15.4 настоящего Устава."]}]}, {"h": "ГЛАВА X. СТРУКТУРНЫЕ ПОДРАЗДЕЛЕНИЯ", "a": [{"n": "Статья 28", "t": "Отдел собственной безопасности", "p": ["28.1. Отдел собственной безопасности (ОСБ) является структурным подразделением ГИБДД, осуществляющим выявление, предупреждение и пресечение нарушений законодательства, служебной дисциплины и внутренних нормативных актов сотрудниками ГИБДД.", "28.2. ОСБ осуществляет рассмотрение обращений, заявлений и жалоб, проведение служебных проверок, фиксацию дисциплинарных нарушений и иные мероприятия в пределах установленной компетенции.", "28.3. Сотрудники ОСБ вправе запрашивать необходимые документы, сведения, объяснения и иные материалы, если их получение связано с исполнением возложенных на ОСБ задач.", "28.4. Личный обыск сотрудников ГИБДД сотрудниками ОСБ допускается только по основаниям и в порядке, предусмотренным статьёй 182 Уголовно-процессуального кодекса РО. Досмотр, обыск и задержание Начальника ГИБДД и его заместителей допускаются только в случаях и порядке, установленных Федеральным законом «О статусе неприкосновенности должностных лиц».", "28.5. Порядок деятельности ОСБ и пределы полномочий его сотрудников определяются Положением о работе отдела собственной безопасности ГИБДД с учётом пункта 4.2 настоящего Устава."]}, {"n": "Статья 29", "t": "Специальный отряд быстрого реагирования (СОБР)", "p": ["29.1. Специальный отряд быстрого реагирования (СОБР) является элитным структурным подразделением ГИБДД, основной задачей которого является оказание силовой поддержки при проведении специальных и фракционных мероприятий.", "29.2. СОБР привлекается для участия в масштабных межведомственных и внутрифракционных операциях, где требуется непосредственное оказание огневой и тактической поддержки, а также пресечение противоправных действий высокой степени опасности.", "29.3. Сотрудники СОБР обеспечивают физическую защиту личного состава ГИБДД при несении службы, а также наделяются особыми полномочиями по применению специальных средств и табельного оружия при выполнении боевых задач в строгом соответствии с законодательством РО и внутренними регламентами."]}, {"n": "Статья 30", "t": "Отдел дорожно-патрульной службы (ДПС)", "p": ["30.1. Отдел дорожно-патрульной службы (ДПС) осуществляет патрулирование, контроль соблюдения Правил дорожного движения, обеспечение безопасности дорожного движения, выявление и пресечение нарушений в пределах установленной компетенции.", "30.2. В структуре отдела ДПС функционирует специализированный подотдел: Мотобатальон (ДПСм), выполняющий задачи и функции, предусмотренные пунктом 30.1, с использованием служебного мототранспорта.", "30.3. Подотдел ДПСм не обладает организационной автономностью и осуществляет свою деятельность в прямом подчинении руководству отдела ДПС."]}, {"n": "Статья 31", "t": "Центр профессиональной подготовки", "p": ["31.1. Центр профессиональной подготовки (ЦПП) является структурным подразделением ГИБДД, обеспечивающим профессиональную подготовку, обучение, проверку знаний и развитие профессиональных компетенций сотрудников.", "31.2. ЦПП осуществляет мероприятия по подготовке сотрудников, проведению экзаменов, тестированию и иным вопросам профессиональной подготовки."]}, {"n": "Статья 32", "t": "Административно-хозяйственный отдел", "p": ["32.1. Административно-хозяйственный отдел (АХО) является структурным подразделением ГИБДД, обеспечивающим материально-техническое снабжение, контроль за оборотом специального вооружения и поддержание складских резервов подразделения.", "32.2. АХО осуществляет мероприятия по проверке запросов и отчётов по специальному вооружению, его выдаче, надзору за укомплектованностью склада, а также курированию мероприятий, нацеленных на пополнение склада."]}, {"n": "Статья 33", "t": "Общие положения о структурных подразделениях", "p": ["33.1. Все структурные подразделения ГИБДД обязаны осуществлять деятельность в соответствии с законодательством РО, настоящим Уставом и иными внутренними нормативными актами.", "33.2. Структурные подразделения обязаны выполнять задачи, направленные на достижение целей и задач, установленных законодательством и руководством ГИБДД.", "33.3. Изменение компетенции, структуры или порядка деятельности структурных подразделений осуществляется приказом Начальника ГИБДД и его заместителей."]}]}], "dis": [{"h": "ГЛАВА I. ОБЩИЕ ПОЛОЖЕНИЯ", "a": [{"n": "Статья 1", "t": "Предмет регулирования", "p": ["1.1. Настоящий Дисциплинарный устав ГИБДД устанавливает единые основы дисциплинарной ответственности сотрудников Государственной инспекции безопасности дорожного движения, порядок применения дисциплинарных взысканий, проведения служебных проверок, переаттестаций и обжалования применённых мер.", "1.2. Действие настоящего Устава распространяется на всех сотрудников ГИБДД независимо от занимаемой должности, специального звания, структурного подразделения и срока службы.", "1.3. Настоящий Устав является обязательным внутренним нормативным актом ГИБДД.", "1.4. Положения настоящего Устава применяются во взаимосвязи с Трудовым кодексом РО, Внутренним уставом ГИБДД, Кодексом этики и служебного поведения, а также иными нормативными актами РО.", "1.5. В случае если отдельный вопрос уже урегулирован иным нормативным актом, настоящий Устав применяется в части, не противоречащей такому акту."]}, {"n": "Статья 2", "t": "Основные принципы дисциплины", "p": ["2.1. Служебная дисциплина основывается на:", "законности;", "соблюдении служебной иерархии;", "единоначалии;", "добросовестном исполнении обязанностей;", "ответственности за принятые решения и совершённые действия;", "неотвратимости ответственности за дисциплинарные нарушения;", "соразмерности дисциплинарного взыскания тяжести проступка;", "объективности рассмотрения обстоятельств нарушения.", "2.2. Незнание положений нормативных актов, регламентов и внутренних распоряжений ГИБДД не освобождает сотрудника от ответственности.", "2.3. Сотрудник обязан самостоятельно знать и соблюдать нормативные акты, непосредственно регулирующие его служебную деятельность.", "2.4. Сотрудник несёт персональную ответственность за соблюдение законодательства, приказов непосредственного руководства и требований внутренних нормативных актов."]}]}, {"h": "ГЛАВА II. СЛУЖЕБНАЯ ДИСЦИПЛИНА", "a": [{"n": "Статья 3", "t": "Обязанности сотрудника", "p": ["3.1. Соблюдать законодательство РО и внутренние нормативные акты ГИБДД;", "3.2. соблюдать требования Устава ГИБДД;", "3.3. соблюдать Кодекс этики и служебного поведения;", "3.4. добросовестно исполнять возложенные на него должностные и служебные обязанности;", "3.5. исполнять законные распоряжения вышестоящих и непосредственных руководителей;", "3.6. соблюдать установленную субординацию;", "3.7. соблюдать правила служебной коммуникации;", "3.8. поддерживать надлежащий уровень профессиональной подготовки;", "3.9. бережно относиться к имуществу и ресурсам ГИБДД;", "3.10. своевременно предоставлять требуемую служебную информацию и документацию;", "3.11. соблюдать установленные правила несения службы;", "3.12. незамедлительно сообщать руководству об обстоятельствах, препятствующих исполнению служебных обязанностей;", "3.13. выполнять требования сотрудников ОСБ в пределах предоставленных им полномочий.", "3.14. Перечень обязанностей, установленных настоящей статьёй, не является исчерпывающим."]}, {"n": "Статья 4", "t": "Запреты для сотрудников", "p": ["4.1. Сотрудникам запрещается:", "использовать служебные полномочия в личных целях;", "превышать предоставленные ему полномочия;", "самовольно изменять установленные порядок и правила несения службы;", "игнорировать законные требования руководства;", "нарушать установленную субординацию;", "использовать служебную информацию в личных целях;", "разглашать сведения ограниченного доступа;", "использовать служебное имущество не по назначению;", "необоснованно отсутствовать на службе;", "самовольно покидать место несения службы;", "препятствовать проведению служебной проверки;", "предоставлять заведомо недостоверные сведения в служебных документах;", "подделывать, изменять или уничтожать служебные материалы;", "уклоняться от исполнения назначенной переаттестации без уважительной причины;", "оказывать давление на лиц, участвующих в рассмотрении дисциплинарного материала;", "использовать должностное положение для оказания неправомерного влияния на других сотрудников;", "совершать действия, порочащие честь сотрудника ГИБДД либо наносящие ущерб авторитету подразделения.", "4.2. Сотруднику ГИБДД категорически запрещается совершать действия, допускать высказывания либо иным образом осуществлять поведение, которое порочит честь и достоинство сотрудника государственных органов, наносит ущерб деловой репутации сотрудника либо дискредитирует авторитет Государственной инспекции безопасности дорожного движения и государственных органов РО.", "4.2.1. К действиям, предусмотренным пунктами 4.1 и 4.2 настоящей статьи, в том числе относятся публичные высказывания, публикации, сообщения и иные формы поведения, способные нанести ущерб авторитету ГИБДД, подорвать доверие к сотрудникам государственных органов либо создать негативное представление о деятельности ГИБДД.", "4.3. Совершение действий, указанных в настоящей статье, является основанием для рассмотрения вопроса о привлечении сотрудника к дисциплинарной ответственности."]}]}, {"h": "ГЛАВА III. ДИСЦИПЛИНАРНЫЙ ПРОСТУПОК", "a": [{"n": "Статья 5", "t": "Понятие дисциплинарного проступка", "p": ["5.1. Дисциплинарным проступком признаётся действие либо бездействие сотрудника, выразившееся в:", "нарушении законодательства РО;", "нарушении настоящего Устава;", "нарушении Устава ГИБДД;", "нарушении Кодекса этики и служебного поведения;", "нарушении внутренних регламентов ГИБДД;", "неисполнении либо ненадлежащем исполнении служебных обязанностей;", "неисполнении законного распоряжения руководства;", "нарушении установленного порядка несения службы.", "5.2. Дисциплинарная ответственность применяется независимо от наличия либо отсутствия оснований для привлечения сотрудника к административной или уголовной ответственности, если соответствующее нарушение одновременно содержит признаки дисциплинарного проступка.", "5.3. Если совершённое деяние содержит признаки уголовного правонарушения, материалы подлежат передаче в компетентный орган в соответствии с законодательством РО."]}, {"n": "Статья 6", "t": "Обстоятельства, учитываемые при назначении взыскания", "p": ["6.1. При определении вида дисциплинарного взыскания учитываются:", "характер совершённого нарушения;", "тяжесть последствий;", "наличие либо отсутствие умысла;", "должностное положение сотрудника;", "специальное звание;", "обстоятельства совершения нарушения;", "наличие предыдущих взысканий;", "отношение сотрудника к совершённому нарушению;", "наличие либо отсутствие ущерба ГИБДД;", "иные обстоятельства, имеющие значение для дела.", "6.2. Наличие предыдущих дисциплинарных взысканий может рассматриваться как обстоятельство, отягчающее дисциплинарную ответственность."]}]}, {"h": "ГЛАВА IV. ДИСЦИПЛИНАРНЫЕ ВЗЫСКАНИЯ", "a": [{"n": "Статья 7", "t": "Виды взысканий", "p": ["7.1. За совершение дисциплинарного проступка к сотруднику могут применяться только виды дисциплинарных взысканий, предусмотренные статьёй 30.1 Трудового кодекса РО:", "предупреждение;", "выговор;", "понижение в должности;", "обязательная переаттестация;", "увольнение из ГИБДД.", "Примечание к пункту 7.1. Внутренние градации выговора (1/3, 2/3, 3/3) применяются исключительно для учёта количества активных выговоров и не образуют самостоятельных видов дисциплинарных взысканий. Базовым взысканием во всех случаях является выговор, предусмотренный подпунктом «б» статьи 30.1 Трудового кодекса РО.", "7.2. Вид взыскания определяется с учётом характера и тяжести совершённого проступка.", "7.3. За одно дисциплинарное нарушение не может быть необоснованно применено несколько самостоятельных дисциплинарных взысканий."]}, {"n": "Статья 8", "t": "Активные дисциплинарные взыскания", "p": ["8.1. Дисциплинарное взыскание считается активным с момента его официального опубликования либо доведения до сотрудника.", "8.2. Наличие активного взыскания может учитываться при принятии кадровых и организационных решений.", "8.3. Наличие активного выговора влечёт:", "запрет на повышение в специальном звании;", "лишение еженедельной премиальной выплаты;", "преимущественное право на выбор даты отпуска у сотрудников, не имеющих активных дисциплинарных взысканий.", "8.3.1. Предоставление отпуска сотруднику, имеющему активное взыскание, не ограничивается и осуществляется в порядке, установленном статьёй 20.4 Трудового кодекса РО.", "8.3.2. Перевод сотрудника, имеющего активное взыскание, в другое подразделение допускается по согласованию с руководством в порядке, установленном статьёй 44 Трудового кодекса РО.", "8.4. Получение сотрудником трёх активных выговоров (3/3) является основанием для рассмотрения вопроса об увольнении по подпункту «а» статьи 43 Трудового кодекса РО. Такое обстоятельство не влечёт автоматического увольнения: решение принимается по результатам служебной проверки в порядке, установленном настоящим Уставом."]}]}, {"h": "ГЛАВА V. ПОЛНОМОЧИЯ ПО ПРИМЕНЕНИЮ ВЗЫСКАНИЙ", "a": [{"n": "Статья 9", "t": "Лица, имеющие право применять взыскания", "p": ["9.1. Дисциплинарные взыскания вправе применять:", "Генералитет ГИБДД;", "старший офицерский состав начиная со звания полковника;", "командование структурного подразделения — в отношении подчинённых сотрудников;", "сотрудники ОСБ в пределах полномочий, установленных настоящим Уставом.", "9.2. Сотрудник, не обладающий полномочиями на непосредственное применение взыскания, при выявлении нарушения обязан направить соответствующие материалы в ОСБ либо непосредственному руководству."]}, {"n": "Статья 10", "t": "Особые полномочия ОСБ", "p": ["10.1. Обычный сотрудник ОСБ вправе самостоятельно применять дисциплинарные взыскания к сотрудникам ГИБДД, имеющим специальное звание не выше капитана. Применение дисциплинарных взысканий к сотрудникам в звании майора и выше относится к компетенции командования ОСБ.", "10.2. Командование ОСБ вправе самостоятельно применять дисциплинарные взыскания к сотрудникам вплоть до звания генерал-майора включительно.", "10.3. При выявлении нарушения сотрудником, в отношении которого ОСБ не обладает непосредственной юрисдикцией, материалы передаются должностному лицу, обладающему соответствующими полномочиями."]}, {"n": "Статья 11", "t": "Дисциплинарная ответственность Генералитета", "p": ["11.1. Генералитет ГИБДД привлекается к дисциплинарной ответственности в особом порядке, установленном настоящей статьёй, но не освобождается от неё.", "11.2. Дисциплинарное взыскание в отношении представителя Генералитета может быть применено исключительно Начальником ГИБДД (специальное звание — генерал) либо иным лицом в порядке, прямо установленном законодательством РО."]}]}, {"h": "ГЛАВА VI. ПОРЯДОК ПРИВЛЕЧЕНИЯ К ДИСЦИПЛИНАРНОЙ ОТВЕТСТВЕННОСТИ", "a": [{"n": "Статья 12", "t": "Основания для рассмотрения нарушения", "p": ["12.1. Основанием для начала рассмотрения вопроса о дисциплинарной ответственности могут являться:", "непосредственное выявление нарушения;", "рапорт сотрудника;", "жалоба;", "материалы ОСБ;", "фото- и видеоматериалы;", "результаты служебной проверки;", "материалы переаттестации;", "иные достоверные сведения о совершении нарушения.", "12.2. Анонимное сообщение само по себе не является достаточным основанием для применения взыскания, однако может являться основанием для проведения проверки."]}, {"n": "Статья 13", "t": "Служебная проверка", "p": ["13.1. При необходимости установления обстоятельств нарушения уполномоченное лицо вправе назначить служебную проверку.", "13.2. В рамках проверки устанавливаются:", "факт нарушения;", "лицо, его совершившее;", "обстоятельства нарушения;", "наличие вины;", "последствия нарушения;", "наличие смягчающих и отягчающих обстоятельств.", "13.3. По результатам проверки принимается решение о наличии либо отсутствии оснований для дисциплинарного взыскания.", "13.4. Сотрудник обязан содействовать проведению проверки и предоставлять имеющиеся у него материалы, относящиеся к рассматриваемому вопросу."]}]}, {"h": "ГЛАВА VII. ДОКУМЕНТИРОВАНИЕ И ДОКАЗАТЕЛЬСТВА", "a": [{"n": "Статья 14", "t": "Доказательственные материалы", "p": ["14.1. Доказательствами по дисциплинарному материалу могут являться:", "фото;", "видеозаписи;", "документы;", "служебная переписка;", "показания сотрудников;", "результаты проверки;", "иные материалы, позволяющие установить обстоятельства нарушения.", "14.2. Лицо, применившее дисциплинарное взыскание, обязано обеспечить сохранность основных доказательственных материалов.", "14.3. Фото- и видеофиксация, использованная в качестве основания для взыскания, хранится не менее 72 часов с момента применения взыскания."]}]}, {"h": "ГЛАВА VIII. ОБЖАЛОВАНИЕ", "a": [{"n": "Статья 15", "t": "Право на обжалование", "p": ["15.1. Сотрудник имеет право обжаловать применённое к нему дисциплинарное взыскание, если считает его необоснованным, несоразмерным либо применённым с нарушением установленного порядка.", "15.2. Обжалование не освобождает сотрудника от исполнения законных требований и ограничений, возникших вследствие применения взыскания, если иное не установлено решением уполномоченного лица."]}, {"n": "Статья 16", "t": "Порядок обжалования", "p": ["16.1. Рапорт об обжаловании подаётся в цифровом виде через установленный канал служебной связи.", "16.2. Срок подачи жалобы составляет 72 часа с момента публикации решения о применении взыскания.", "16.3. По истечении указанного срока жалоба может быть оставлена без рассмотрения, если сотрудником не представлены уважительные причины пропуска срока.", "16.4. Жалобы рассматриваются:", "на взыскания, применённые сотрудниками ГИБДД, — ОСБ;", "на взыскания, применённые сотрудником ОСБ, — командованием ОСБ;", "на взыскания, применённые руководителем ОСБ, — Начальником ГИБДД.", "16.5. Лицо, применившее обжалуемое взыскание, не может самостоятельно рассматривать жалобу на собственное решение."]}]}, {"h": "ГЛАВА IX. СНЯТИЕ ДИСЦИПЛИНАРНЫХ ВЗЫСКАНИЙ", "a": [{"n": "Статья 17", "t": "Общий порядок", "p": ["17.1. Дисциплинарное взыскание не снимается автоматически.", "17.2. Для снятия взыскания сотрудник вправе подать рапорт после выполнения установленной нормы отработки.", "17.3. Минимальный срок до подачи рапорта на снятие выговора составляет 24 часа с момента его получения.", "17.4. Конкретная норма отработки определяется лицом, применившим взыскание.", "17.5. Отработка может включать:", "дополнительное патрулирование;", "дежурство;", "выполнение служебного поручения;", "иные соразмерные меры.", "17.5.1. Добровольное возмещение сотрудником причинённого ущерба допускается только с его согласия, не является дисциплинарным взысканием и не заменяет установленную норму отработки.", "17.6. Руководители подразделений вправе устанавливать дополнительные нормы отработки для личного состава своего подразделения.", "17.7. Отработка не может использоваться для унижения сотрудника либо возложения на него заведомо несоразмерных обязанностей."]}]}, {"h": "ГЛАВА X. ПЕРЕАТТЕСТАЦИЯ", "a": [{"n": "Статья 18", "t": "Общие положения", "p": ["18.1. Порядок направления сотрудников на обязательную переаттестацию, проведения проверки профессиональной пригодности, количества попыток, сроков прохождения и последствий непрохождения определяется Регламентом переаттестаций ГИБДД, являющимся неотъемлемой частью настоящего Устава.", "18.2. Переаттестация применяется в целях проверки профессиональной пригодности сотрудника и является самостоятельным видом дисциплинарного взыскания в случаях, предусмотренных пунктом 7.1 настоящего Устава (подпункт «г» статьи 30.1 Трудового кодекса РО).", "18.3. Направление на переаттестацию может применяться, в частности, при:", "грубом нарушении служебных обязанностей;", "систематическом нарушении внутренних регламентов;", "выявлении недостаточного уровня профессиональной подготовки;", "неоднократном нарушении законодательства;", "наличии иных обстоятельств, свидетельствующих о возможной профессиональной непригодности сотрудника."]}, {"n": "Статья 19", "t": "Полномочия по переаттестации", "p": ["19.1. Проводить переаттестацию вправе:", "сотрудники ОСБ;", "инструкторы и командование ЦПП;", "Генералитет ГИБДД.", "19.2. Направление на переаттестацию вправе выдавать лица, указанные в соответствующем Регламенте переаттестаций.", "19.3. Порядок проведения переаттестации и оформления её результатов определяется соответствующим Регламентом."]}]}, {"h": "ГЛАВА XI. ОТВЕТСТВЕННОСТЬ ЗА НЕИСПОЛНЕНИЕ ДИСЦИПЛИНАРНЫХ ТРЕБОВАНИЙ", "a": [{"n": "Статья 20", "t": "Неисполнение дисциплинарных решений", "p": ["20.1. Уклонение от исполнения законного дисциплинарного решения является самостоятельным дисциплинарным проступком.", "20.2. К таким действиям относятся:", "отказ от прохождения назначенной переаттестации;", "отказ от выполнения установленной отработки;", "самовольное снятие ограничений;", "игнорирование законных требований уполномоченного лица;", "воспрепятствование исполнению дисциплинарного решения.", "20.3. Совершение указанных действий может повлечь применение дополнительного дисциплинарного взыскания."]}]}, {"h": "ГЛАВА XII. ПОРЯДОК ПОВЕДЕНИЯ СОТРУДНИКОВ ПРИ ПРОВЕДЕНИИ СЛУЖЕБНЫХ МЕРОПРИЯТИЙ", "a": [{"n": "Статья 21", "t": "Общие положения", "p": ["21.1. При проведении организованных служебных мероприятий, включая поставки, построения и движение служебной колонны, сотрудники ГИБДД обязаны соблюдать установленный порядок построения, движения и взаимодействия, а также выполнять законные распоряжения ответственных за проведение мероприятия лиц.", "21.2. На период проведения мероприятия сотрудники обязаны соблюдать установленную организаторами схему построения и порядок движения до момента официального окончания мероприятия либо получения иного распоряжения.", "21.3. Самовольное изменение установленного места в строю, перестроение, отрыв от колонны либо самовольное покидание строя запрещается. Обгон участников колонны запрещается, за исключением случаев, предусмотренных распоряжением старшего колонны.", "21.4. При проведении мероприятия сотрудники обязаны соблюдать требования настоящего Устава, Внутреннего устава ГИБДД, Кодекса этики и служебного поведения, а также иных действующих регламентов.", "21.5. Старшим колонны и иным назначенным ответственным лицам предоставляется право отдавать распоряжения, необходимые для организации и безопасного проведения мероприятия."]}, {"n": "Статья 22", "t": "Порядок проведения поставок", "p": ["22.1. Перед началом поставки личный состав обязан занять установленное место в строю и подготовить служебный транспорт к организованному движению.", "22.2. Порядок расположения транспортных средств определяется ответственным за проведение поставки лицом с учётом назначения транспортного средства и выполняемой сотрудником задачи.", "22.3. Во время движения поставки сотрудникам запрещается:", "самовольно менять установленное место в колонне;", "совершать обгон без соответствующего распоряжения старшего колонны;", "создавать разрыв между транспортными средствами;", "отставать от колонны без уважительной причины;", "самовольно покидать колонну;", "осуществлять необоснованные перестроения;", "совершать действия, препятствующие организованному движению колонны.", "22.4. В случае возникновения обстоятельств, препятствующих дальнейшему движению, сотрудник обязан незамедлительно сообщить об этом старшему колонны либо иному ответственному лицу.", "22.5. По окончании поставки сотрудники обязаны оставаться в распоряжении старшего колонны до момента официального завершения мероприятия либо получения разрешения на убытие."]}, {"n": "Статья 23", "t": "Порядок движения служебной колонны", "p": ["23.1. Движение колонны осуществляется в установленном порядке и по определённому маршруту.", "23.2. Первые 3–5 транспортных средств, следующих перед основной частью колонны и транспортными средствами сопровождения, при необходимости используются для организации и обеспечения перекрытия маршрута движения.", "23.3. Количество транспортных средств, задействованных для перекрытия, определяется ответственным за организацию движения лицом исходя из дорожной обстановки, протяжённости колонны и необходимости обеспечения её беспрепятственного прохождения.", "23.4. Транспортные средства, осуществляющие перекрытие, обязаны заблаговременно занимать необходимые позиции и обеспечивать безопасное продвижение основной части колонны.", "23.5. Сотрудникам, осуществляющим перекрытие, запрещается без необходимости оставлять занимаемую позицию, прекращать выполнение задачи либо допускать возникновение необоснованного разрыва между транспортными средствами.", "23.6. В случае возникновения необходимости изменения порядка движения, маршрута либо состава колонны соответствующее решение принимается старшим колонны или иным ответственным должностным лицом."]}, {"n": "Статья 24", "t": "Порядок следования основной части колонны", "p": ["24.1. Транспортные средства сопровождения следуют в составе основной колонны в установленном порядке.", "24.2. Сотрудники обязаны соблюдать безопасную и установленную дистанцию между транспортными средствами.", "24.3. Запрещается самовольно вклиниваться между транспортными средствами, осуществляющими перекрытие, транспортными средствами сопровождения либо иными транспортными средствами, если это не предусмотрено установленным порядком движения.", "24.4. Самовольный обгон транспортных средств сопровождения либо иных транспортных средств колонны запрещается.", "24.5. При вынужденном прекращении движения сотрудник обязан по возможности сохранить своё место в колонне и незамедлительно уведомить старшего колонны о возникшей ситуации.", "24.6. При необходимости остановки части колонны старший колонны обязан обеспечить сохранение организованного порядка движения и не допустить необоснованного разрыва между её элементами."]}, {"n": "Статья 25", "t": "Контроль за соблюдением дисциплины при проведении мероприятий", "p": ["25.1. При проведении поставок в составе колонны по решению руководства ОСБ назначается не менее одного сотрудника Отдела собственной безопасности, осуществляющего контроль за соблюдением личным составом служебной дисциплины. Назначение производится при наличии возможности выделения сотрудника ОСБ.", "25.2. Сотрудник ОСБ, назначенный для осуществления контроля за поставкой, по общему правилу обязан следовать в конце колонны.", "25.3. Сотрудник ОСБ обязан осуществлять контроль за действиями личного состава и фиксировать выявленные нарушения настоящего Устава, Устава ГИБДД, иных нормативных актов и установленных правил проведения мероприятия.", "25.4. При выявлении нарушения сотрудник ОСБ вправе осуществлять фото- и видеофиксацию соответствующего факта.", "25.5. Сотрудник ОСБ обязан по окончании мероприятия передать зафиксированные материалы в установленном порядке для решения вопроса о привлечении виновного сотрудника к дисциплинарной ответственности.", "25.6. Сотрудник ОСБ вправе временно изменить своё место в колонне либо покинуть её конечную позицию, если это необходимо для:", "пресечения нарушения;", "фиксации нарушения;", "обеспечения безопасности;", "исполнения распоряжения руководства ОСБ;", "выполнения иных служебных задач.", "25.7. Отсутствие сотрудника ОСБ при проведении поставки допускается исключительно при наличии объективных причин и с разрешения руководства ОСБ.", "25.8. Осуществление сотрудником ОСБ контроля за мероприятием не освобождает остальных сотрудников ГИБДД от обязанности самостоятельно соблюдать требования настоящего Устава и установленные правила проведения мероприятия."]}, {"n": "Статья 26", "t": "Ответственность за нарушение порядка проведения мероприятий", "p": ["26.1. Нарушение сотрудником установленного порядка построения, движения либо поведения при проведении служебного мероприятия является дисциплинарным проступком.", "26.2. В зависимости от характера и тяжести нарушения к сотруднику могут быть применены меры дисциплинарного взыскания, предусмотренные настоящим Уставом.", "26.3. Систематическое нарушение порядка проведения служебных мероприятий может являться основанием для направления сотрудника на обязательную переаттестацию в соответствии с Регламентом переаттестаций ГИБДД.", "26.4. Неисполнение законного распоряжения старшего колонны либо ответственного за проведение мероприятия лица рассматривается как самостоятельное дисциплинарное нарушение."]}]}, {"h": "ГЛАВА XIII. ЗАКЛЮЧИТЕЛЬНЫЕ ПОЛОЖЕНИЯ", "a": [{"n": "Статья 27", "t": "Обязательность настоящего Устава", "p": ["27.1. Настоящий Устав обязателен для исполнения всеми сотрудниками ГИБДД.", "27.2. Незнание настоящего Устава не освобождает сотрудника от ответственности за его нарушение.", "27.3. Руководители подразделений несут ответственность за доведение положений настоящего Устава до подчинённого личного состава.", "27.4. Внутренние положения и регламенты подразделений не могут противоречить настоящему Уставу."]}, {"n": "Статья 28", "t": "Соотношение с иными нормативными актами", "p": ["28.1. Настоящий Устав применяется совместно с:", "Трудовым кодексом РО;", "Внутренним уставом ГИБДД;", "Кодексом этики и служебного поведения;", "иными нормативными актами РО.", "28.2. В случае противоречия настоящего Устава нормативному акту более высоко  | Имя Фамилия | Номер удостоверения;", "2. Кто применил взыскание: @Тег | Имя Фамилия | Должность;", "3. Суть обжалования: подробно объяснить, почему выговор применён ошибочно;", "4. Доказательства с вашей стороны: (( ссылка на любой видео- или фотохостинг )).", "Прошу Командование ОСБ провести проверку по данному факту и пересмотреть решение о взыскании.", "@Командование ОСБ"]}, {"n": "", "t": "Форма апелляции выговора Руководителя Отдела собственной безопасности", "p": ["Я, Имя Фамилия, обращаюсь к Генералитету ГИБДД с рапортом о пересмотре вынесенного мне дисциплинарного взыскания в связи с несогласием с решением.", "Данные заявителя:", "1. Ваши данные: @Тег | Имя Фамилия | Номер удостоверения;", "2. Кто применил взыскание: @Тег | Имя Фамилия | Должность;", "3. Суть обжалования: подробно объяснить, почему выговор применён ошибочно;", "4. Доказательства с вашей стороны: (( ссылка на любой видео- или фотохостинг )).", "Прошу Генералитет ГИБДД провести проверку по данному факту и пересмотреть решение о взыскании.", "@Генералитет ГИБДД"]}, {"n": "", "t": "Форма рапорта на снятие взыскания (отработка)", "p": ["Я, Имя Фамилия, докладываю, что назначенная мне норма отработки для снятия дисциплинарного взыскания была выполнена в полном объёме.", "Отчётные данные:", "1. Данные сотрудника: @Тег | Имя Фамилия | Отдел;", "2. Ссылка на выданное взыскание: (( ссылка на сообщение ));", "3. Суть проделанной работы: краткое описание выполненных задач;", "4. Материалы доказательств: (( ссылка на любой видео- или фотохостинг )).", "Прошу рассмотреть настоящий рапорт и снять с меня действующее дисциплинарное взыскание.", "@Тег того, кто применил взыскание"]}]}, {"h": "ПРИЛОЖЕНИЕ № 2", "a": [{"n": "", "t": "", "p": ["К ДИСЦИПЛИНАРНОМУ УСТАВУ ГИБДД", "ИНФОРМАЦИОННЫЙ РЕГЛАМЕНТ ПЕРЕАТТЕСТАЦИЙ"]}, {"n": "", "t": "1. Общие положения", "p": ["1.1. Настоящим Регламентом регулируется порядок, правила и формы направления сотрудников ГИБДД на прохождение аттестации профессиональной пригодности и иные связанные с ней процедуры.", "1.2. Проводить переаттестацию имеют право:", "сотрудники ОСБ (Отдела собственной безопасности);", "инструкторы и Командование ЦПП (Центра профессиональной подготовки).", "Исключение: Генералитет ГИБДД может лично проводить переаттестацию при условии написания направления на переаттестацию от собственного имени.", "1.3. Переаттестация представляет собой комплексную проверку знаний Федерального закона РО «О полиции», Уголовно-процессуального кодекса РО, Устава ГИБДД, Правил дорожного движения РО (ФКЗ № 4), Регламентов и уголовного законодательства РО.", "1.4. Сотрудник, проводивший аттестацию, обязан хранить видеофиксацию процесса проведения аттестации в течение 72 часов с момента её окончания, независимо от итогового результата проверки.", "1.5. Для целей настоящего Регламента под понятием «Командование отдела» понимаются следующие должностные лица:", "Руководитель отдела в звании генерал-лейтенанта;", "Командир отдела в звании генерал-майора;", "Заместители командира отдела в звании полковника.", "Примечание: решение вышестоящего должностного лица имеет высшую силу."]}, {"n": "", "t": "2. Право и порядок направления на переаттестацию", "p": ["2.1. Прямым правом написания направления без предварительных согласований обладают:", "Генералитет ГИБДД;", "старший офицерский состав, начиная со звания полковника;", "сотрудники ОСБ.", "2.2. Иные лица не имеют права напрямую публиковать направление на переаттестацию без предварительного согласования и утверждения со стороны сотрудников ОСБ.", "2.3. Лицо, подавшее направление на переаттестацию, является официально прикреплённым к данной процедуре. Приём аттестации профессиональной пригодности проводится им лично либо в его присутствии, если оно не входит в список лиц, указанных в пункте 2.1 настоящего Регламента."]}, {"n": "", "t": "3. Правила и ограничения при переаттестации", "p": ["3.1. На прохождение переаттестации сотруднику предоставляется до 7 (семи) рабочих дней с момента публикации направления.", "3.2. С момента публикации направления сотрудник отстраняется от исполнения служебных обязанностей до опубликования отчёта о сдаче.", "3.3. На период отстранения категорически запрещено:", "надевать служебную форму;", "использовать служебный автопарк;", "заступать в патруль;", "проводить задержания;", "применять служебное оружие и спецсредства.", "3.4. Сотруднику предоставляется не более 2 (двух) попыток. Повторная попытка назначается не ранее чем через 5 часов после провала первой.", "3.5. Неявка на переаттестацию в течение 48 часов без утверждённой отсрочки прохождения переаттестации является основанием для рассмотрения вопроса об увольнении из органов ГИБДД по подпункту «а» статьи 43 Трудового кодекса РО, а также для решения вопроса о занесении в чёрный список в порядке статьи 33 Трудового кодекса РО. Автоматическое увольнение не допускается.", "3.6. В случае если сотрудник, ответственный за определённую аттестацию, не уполномочен на самостоятельное применение меры, описанной в пункте 3.5 настоящего Регламента, итоговое решение передаётся Руководителю ОСБ и/или ЦПП.", "3.7. Варианты итоговых решений по результатам переаттестации:", "Успешное прохождение: полное восстановление в служебных правах и снятие отстранения.", "Провал 1-й попытки: назначение повторной попытки не ранее чем через 5 часов.", "Провал 2-й попытки / Неявка: применение дисциплинарного наказания.", "3.8. Если экзаменатор не уполномочен самостоятельно понижать/увольнять сотрудника, в отчёте выставляется статус «НЕ СДАЛ — Передано Командованию».", "Примечание: Командование ОСБ/ЦПП обязано в течение 24 часов с момента публикации отчёта вынести итоговую резолюцию с конкретным дисциплинарным наказанием."]}, {"n": "", "t": "4. Права сотрудника", "p": ["4.1. Сотрудник ГИБДД, в отношении которого написано направление на переаттестацию, имеет право на перенос времени переаттестации при наличии объективных причин.", "4.2. Для переноса сроков сотрудник обязан до истечения 24 часов после публикации направления на переаттестацию уведомить Командование ОСБ. В случае одобрения отстранение от службы продолжает действовать до момента сдачи.", "4.3. Максимальный срок отсрочки (переноса) прохождения переаттестации составляет не более 48 часов с момента одобрения заявки Командованием ОСБ. На весь период отсрочки отстранение от исполнения служебных обязанностей продолжает действовать в полном объёме."]}]}]}</script>
